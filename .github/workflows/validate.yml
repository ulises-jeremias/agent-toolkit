name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-validate
  cancel-in-progress: true

jobs:
  # ── Job 1: Python package tests across OS × Python-version matrix ──────────
  test-package:
    name: Test Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Smoke-test CLI entry-point (version)
        run: agent-toolkit version

      - name: Smoke-test CLI entry-point (help)
        run: agent-toolkit help

      - name: Run test suite
        # Allow test failures to surface without blocking the matrix when tests
        # are skipped in some environments (e.g. missing optional data dirs).
        run: pytest tests/ -v --tb=short

  # ── Job 2: Validate SKILL.md and AGENT.md frontmatter ─────────────────────
  validate-skills:
    name: Validate Skills & Agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: Validate SKILL.md frontmatter (Agent Skills spec)
        run: python3 scripts/validate-skills.py

      - name: Validate AGENT.md frontmatter
        run: python3 scripts/validate-agents.py

  # ── Job 3: Validate marketplace manifests and plugin.json files ────────────
  validate-manifests:
    name: Validate Marketplace Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml==6.0.2 jsonschema==4.23.0

      - name: Validate Claude Code and Cursor marketplace manifests
        run: python3 scripts/validate-manifests.py

  # ── Job 4: Detect plugin surface drift ────────────────────────────────────
  check-surfaces:
    name: Check Plugin Bundle Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: Assert plugin surfaces are in sync with canonical sources
        run: python3 scripts/gen-surfaces.py --check

  # ── Job 5: Validate loop.yaml files against loop.schema.json ──────────────
  validate-loops:
    name: Validate Loop Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml==6.0.2 jsonschema==4.23.0

      - name: Validate loop.yaml files against loop.schema.json
        run: |
          set -euo pipefail

          if [ ! -f schemas/loop.schema.json ]; then
            echo "schemas/loop.schema.json not found — skipping."
            exit 0
          fi

          if [ ! -d loops ]; then
            echo "No loops/ directory — skipping."
            exit 0
          fi

          python3 - <<'PYEOF'
          import json, sys, yaml
          from pathlib import Path
          from jsonschema import validate, ValidationError

          schema = json.loads(Path("schemas/loop.schema.json").read_text())

          errors = []
          loop_files = sorted(Path("loops").rglob("loop.yaml"))

          if not loop_files:
              print("No loop.yaml files found — nothing to validate.")
              sys.exit(0)

          for f in loop_files:
              try:
                  d = yaml.safe_load(f.read_text())
                  validate(d, schema)
                  print(f"  OK: {f}")
              except ValidationError as e:
                  errors.append(f"  FAIL: {f}: {e.message}")
                  print(f"  FAIL: {f}: {e.message}", file=sys.stderr)

          print()
          if errors:
              print(f"{len(errors)} loop validation error(s).", file=sys.stderr)
              sys.exit(1)

          print(f"All {len(loop_files)} loop template(s) valid.")
          PYEOF

  # ── Job 6: Secret pattern scan ────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks catches secrets in full git history, not just the working tree.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt-and-suspenders: additional regex patterns specific to this toolkit.
      - name: Additional pattern scan in toolkit directories
        run: |
          set -euo pipefail

          # Patterns that must never appear in committed toolkit files.
          # Keep in sync with SECURITY.md allowlist of false-positive exclusions.
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'
            'sk-[a-zA-Z0-9]{32,}'
            'sk-ant-[a-zA-Z0-9]'
            'ghp_[a-zA-Z0-9]{36}'
            'gho_[a-zA-Z0-9]{36}'
            'ghs_[a-zA-Z0-9]{36}'
            'github_pat_[a-zA-Z0-9_]{82}'
            'xoxb-[a-zA-Z0-9-]+'
            'xoxp-[a-zA-Z0-9-]+'
            'ghr_[a-zA-Z0-9]'
            'AIza[0-9A-Za-z\-_]{35}'
          )

          SCAN_DIRS=(skills agents profiles mcp loops src)
          EXCLUDE_ARGS=(
            '--exclude-dir=.git'
            '--exclude-dir=node_modules'
            '--exclude-dir=.venv'
          )

          found=0
          for pattern in "${PATTERNS[@]}"; do
            for scan_dir in "${SCAN_DIRS[@]}"; do
              [ -d "$scan_dir" ] || continue
              if grep -rEIq "${EXCLUDE_ARGS[@]}" "$pattern" "$scan_dir" 2>/dev/null; then
                echo "::error::Possible secret matched pattern '$pattern' in $scan_dir/"
                grep -rEI "${EXCLUDE_ARGS[@]}" "$pattern" "$scan_dir" 2>/dev/null || true
                found=$((found + 1))
              fi
            done
          done

          if [ "$found" -gt 0 ]; then
            echo ""
            echo "${found} potential secret pattern(s) detected. Review the matches above."
            echo "If these are false positives, use a placeholder value or add an inline exclusion."
            exit 1
          fi

          echo "No secret patterns detected."

  # ── Job 7: Markdown lint ──────────────────────────────────────────────────
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.44.0

      - name: Run markdownlint
        run: |
          markdownlint \
            --config .markdownlint.yaml \
            --ignore node_modules \
            --ignore .git \
            --ignore packaging \
            '**/*.md' || true
          echo "✓ Markdown lint complete (advisory)"

  # ── Job 8: YAML lint ──────────────────────────────────────────────────────
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint \
            -c .yamllint.yaml \
            loops/ \
            catalogs/ \
            schemas/ \
            packs/ \
            .github/workflows/ \
            || true

  # ── Job 9: Build package — ensures a clean wheel and sdist ────────────────
  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build toolchain
        run: pip install build hatchling

      - name: Build wheel and sdist
        run: python -m build

      - name: Install built wheel and smoke-test
        run: |
          pip install dist/*.whl
          agent-toolkit version

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
