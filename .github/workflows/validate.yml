name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate skill structure and frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml==6.0.2

      - name: Validate SKILL.md frontmatter across all skills
        run: python3 scripts/validate-skills.py

      - name: Validate AGENT.md frontmatter across all agents
        run: python3 scripts/validate-agents.py

  validate-manifests:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml==6.0.2 jsonschema==4.23.0

      - name: Validate marketplace and plugin manifests
        run: python3 scripts/validate-manifests.py

  check-surfaces:
    name: Check plugin surface drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml==6.0.2

      - name: Check surfaces are in sync with canonical sources
        run: python3 scripts/gen-surfaces.py --check

  validate-loops:
    name: Validate loop templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml==6.0.2 jsonschema==4.23.0

      - name: Validate loop.yaml files against loop.schema.json
        run: |
          set -euo pipefail

          if [ ! -f schemas/loop.schema.json ]; then
            echo "schemas/loop.schema.json not found — skipping."
            exit 0
          fi

          if [ ! -d loops ]; then
            echo "No loops/ directory — skipping."
            exit 0
          fi

          python3 - <<'PYEOF'
          import json, sys, yaml
          from pathlib import Path
          from jsonschema import validate, ValidationError

          schema = json.loads(Path("schemas/loop.schema.json").read_text())

          errors = []
          loop_files = sorted(Path("loops").rglob("loop.yaml"))

          if not loop_files:
              print("No loop.yaml files found — nothing to validate.")
              sys.exit(0)

          for f in loop_files:
              try:
                  d = yaml.safe_load(f.read_text())
                  validate(d, schema)
                  print(f"  OK: {f}")
              except ValidationError as e:
                  errors.append(f"  FAIL: {f}: {e.message}")
                  print(f"  FAIL: {f}: {e.message}", file=sys.stderr)

          print()
          if errors:
              print(f"{len(errors)} loop validation error(s).", file=sys.stderr)
              sys.exit(1)

          print(f"All {len(loop_files)} loop template(s) valid.")
          PYEOF

  secret-scan:
    name: Scan for secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan common secret patterns in toolkit files
        run: |
          set -euo pipefail

          # Patterns that should never appear in committed toolkit files.
          # Keep in sync with SECURITY.md allowlist of false-positive exclusions.
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'
            'sk-[a-zA-Z0-9]{32,}'
            'sk-ant-[a-zA-Z0-9]'
            'ghp_[a-zA-Z0-9]{36}'
            'gho_[a-zA-Z0-9]{36}'
            'ghs_[a-zA-Z0-9]{36}'
            'github_pat_[a-zA-Z0-9_]{82}'
            'xoxb-[a-zA-Z0-9-]+'
            'xoxp-[a-zA-Z0-9-]+'
            'ghr_[a-zA-Z0-9]'
            'AIza[0-9A-Za-z\-_]{35}'
          )

          SCAN_DIRS=(skills agents profiles mcp loops)
          EXCLUDE_DIRS=(
            '--exclude-dir=.git'
            '--exclude-dir=node_modules'
          )

          found=0
          for pattern in "${PATTERNS[@]}"; do
            for scan_dir in "${SCAN_DIRS[@]}"; do
              [ -d "$scan_dir" ] || continue
              if grep -rEq "${EXCLUDE_DIRS[@]}" "$pattern" "$scan_dir" 2>/dev/null; then
                echo "WARN: Possible secret matched pattern '$pattern' in $scan_dir/"
                grep -rE "${EXCLUDE_DIRS[@]}" "$pattern" "$scan_dir" 2>/dev/null || true
                found=$((found + 1))
              fi
            done
          done

          if [ "$found" -gt 0 ]; then
            echo ""
            echo "${found} potential secret pattern(s) detected. Review the matches above."
            echo "If these are false positives, use a placeholder value or add an inline exclusion."
            exit 1
          fi

          echo "No secret patterns detected."

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.44.0

      - name: Run markdownlint
        run: |
          # Strict when .markdownlint.yaml is present; tolerant mode otherwise.
          if [ -f .markdownlint.yaml ]; then
            markdownlint \
              --config .markdownlint.yaml \
              --ignore node_modules \
              --ignore .git \
              '**/*.md'
          else
            markdownlint \
              --ignore node_modules \
              --ignore .git \
              '**/*.md' || true
          fi
