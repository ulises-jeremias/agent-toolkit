name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md and skill.json present in each skill directory
        run: |
          set -euo pipefail
          errors=0

          if [ ! -d skills ]; then
            echo "No skills/ directory found — skipping skill structure check."
            exit 0
          fi

          for skill_dir in skills/*/; do
            skill_name="$(basename "$skill_dir")"

            if [ ! -f "${skill_dir}SKILL.md" ]; then
              echo "ERROR: skills/${skill_name}/SKILL.md is missing"
              errors=$((errors + 1))
            fi

            if [ ! -f "${skill_dir}skill.json" ]; then
              echo "ERROR: skills/${skill_name}/skill.json is missing"
              errors=$((errors + 1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "${errors} skill structure error(s) found. Each skill directory must contain SKILL.md and skill.json."
            exit 1
          fi

          echo "All skill directories have SKILL.md and skill.json."

  validate-skill-json:
    name: Validate skill.json against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: pip install jsonschema==4.23.0

      - name: Validate each skill.json against schemas/skill.schema.json
        run: |
          set -euo pipefail

          if [ ! -f schemas/skill.schema.json ]; then
            echo "schemas/skill.schema.json not found — skipping."
            exit 0
          fi

          if [ ! -d skills ]; then
            echo "No skills/ directory — skipping skill.json validation."
            exit 0
          fi

          errors=0
          for manifest in skills/*/skill.json; do
            python3 - "$manifest" schemas/skill.schema.json <<'PYEOF'
          import json, jsonschema, sys

          instance_path = sys.argv[1]
          schema_path   = sys.argv[2]

          with open(schema_path) as f:
              schema = json.load(f)
          with open(instance_path) as f:
              instance = json.load(f)

          try:
              jsonschema.validate(instance, schema)
              print(f"OK: {instance_path}")
          except jsonschema.ValidationError as e:
              print(f"FAIL: {instance_path} -- {e.message}", file=sys.stderr)
              sys.exit(1)
          PYEOF
            status=$?
            if [ $status -ne 0 ]; then
              errors=$((errors + 1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "${errors} skill.json validation error(s)."
            exit 1
          fi

  validate-loops:
    name: Validate loop templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML and jsonschema
        run: pip install pyyaml==6.0.2 jsonschema==4.23.0

      - name: Validate loop.yaml files against schemas/loop.schema.json
        run: |
          set -euo pipefail

          if [ ! -f schemas/loop.schema.json ]; then
            echo "schemas/loop.schema.json not found — skipping loop validation."
            exit 0
          fi

          if [ ! -d loops ]; then
            echo "No loops/ directory — skipping loop validation."
            exit 0
          fi

          python3 - schemas/loop.schema.json loops <<'PYEOF'
          import json, sys
          import yaml
          import jsonschema
          from pathlib import Path

          schema_path = Path(sys.argv[1])
          loops_dir   = Path(sys.argv[2])

          with open(schema_path) as f:
              schema = json.load(f)

          errors = 0
          for loop_yaml in sorted(loops_dir.glob("*/loop.yaml")):
              with open(loop_yaml) as f:
                  instance = yaml.safe_load(f)

              try:
                  jsonschema.validate(instance, schema)
                  print(f"OK: {loop_yaml}")
              except jsonschema.ValidationError as e:
                  print(f"FAIL: {loop_yaml} -- {e.message}", file=sys.stderr)
                  errors += 1

          if errors:
              print(f"\n{errors} loop validation error(s).", file=sys.stderr)
              sys.exit(1)

          print(f"\nAll loop templates validated successfully.")
          PYEOF

  check-secrets:
    name: Check for secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for common secret patterns
        run: |
          set -euo pipefail

          # Patterns that should never appear in committed files.
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'
            'sk-[a-zA-Z0-9]{32,}'
            'ghp_[a-zA-Z0-9]{36}'
            'gho_[a-zA-Z0-9]{36}'
            'ghs_[a-zA-Z0-9]{36}'
            'github_pat_[a-zA-Z0-9_]{82}'
            'xox[baprs]-[a-zA-Z0-9-]+'
            'AIza[0-9A-Za-z\-_]{35}'
            'eyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}'
          )

          EXCLUDE_DIRS=(
            '--exclude-dir=.git'
            '--exclude-dir=node_modules'
          )

          found=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rEq "${EXCLUDE_DIRS[@]}" "$pattern" . 2>/dev/null; then
              echo "WARN: Possible secret matched pattern: $pattern"
              grep -rE "${EXCLUDE_DIRS[@]}" "$pattern" . 2>/dev/null || true
              found=$((found + 1))
            fi
          done

          if [ "$found" -gt 0 ]; then
            echo ""
            echo "Potential secrets detected. Review the matches above."
            echo "If these are false positives, exclude the file or use a placeholder."
            exit 1
          fi

          echo "No secret patterns detected."

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.44.0

      - name: Run markdownlint
        run: |
          # Exits 0 when no .markdownlint.yaml is present (tolerant mode).
          # To enforce strictly: commit a .markdownlint.yaml at repo root.
          if [ -f .markdownlint.yaml ]; then
            markdownlint --config .markdownlint.yaml --ignore node_modules --ignore .git '**/*.md'
          else
            markdownlint --ignore node_modules --ignore .git '**/*.md' || true
          fi
