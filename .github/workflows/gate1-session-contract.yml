name: Gate 1 Session Contract (Hermetic)

on:
  pull_request:
    paths:
      - 'scripts/spikes/1669-session-journal.mjs'
      - 'test/spikes/1669-session-journal.test.mjs'
      - 'scripts/spikes/1669-process-transport.mjs'
      - 'test/spikes/1669-process-transport.test.mjs'
      - 'test/spikes/1669-process-abort.test.mjs'
      - '.github/workflows/gate1-session-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/spikes/1669-session-journal.mjs'
      - 'test/spikes/1669-session-journal.test.mjs'
      - 'scripts/spikes/1669-process-transport.mjs'
      - 'test/spikes/1669-process-transport.test.mjs'
      - 'test/spikes/1669-process-abort.test.mjs'
      - '.github/workflows/gate1-session-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate hermetic and subprocess fixture contracts (not Gate 1 acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: node --test test/spikes/1669-session-journal.test.mjs test/spikes/1669-process-transport.test.mjs test/spikes/1669-process-abort.test.mjs
