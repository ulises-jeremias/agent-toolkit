name: desktop

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'docs/surface/openapi.json'
      - '.github/workflows/desktop.yml'
      # The gates build the V backend for packaging and check the TS
      # client against it: backend changes must retrigger this workflow.
      - 'modules/agent_toolkit_server/**'
      - 'modules/agent_toolkit_core/**'
      - 'cmd/agent-toolkit/**'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'docs/surface/openapi.json'
      - '.github/workflows/desktop.yml'
      - 'modules/agent_toolkit_server/**'
      - 'modules/agent_toolkit_core/**'
      - 'cmd/agent-toolkit/**'
  workflow_dispatch:
    inputs:
      capture_visual_review:
        description: Capture fresh Electron screenshots for visual review
        required: false
        type: boolean
        default: false

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check generated world assets
        run: node apps/desktop/scripts/gen-world-assets.mjs --check
      - name: Setup pinned V
        uses: ./.github/actions/setup-v
        with:
          v_zip: v_linux.zip
      - name: Build V backend for packaging
        env:
          VMODULES: ${{ github.workspace }}/modules
        run: |
          set -euo pipefail
          mkdir -p dist
          "${VBIN}" -prod -cc gcc -d "commit=$(git rev-parse --short HEAD)" \
            -o dist/agent-toolkit cmd/agent-toolkit
          ./dist/agent-toolkit --version
      - run: pnpm --filter agent-toolkit-desktop gen:api
      - run: git diff --exit-code -- apps/desktop/src/lib/api-schema.d.ts
      - run: pnpm --filter agent-toolkit-desktop lint
      - run: pnpm --filter agent-toolkit-desktop type-check
      - run: pnpm --filter agent-toolkit-desktop test
      - run: pnpm --filter agent-toolkit-desktop build:all
      - run: pnpm --filter agent-toolkit-desktop exec playwright install chromium --with-deps
      - name: E2E (renderer)
        run: pnpm --filter agent-toolkit-desktop exec playwright test --project=renderer
      - name: Prepare Electron for world capture
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        run: pnpm --filter agent-toolkit-desktop exec electron --no-sandbox --version
      - name: Capture world visual review
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        env:
          ATK_E2E_BACKEND_BIN: ${{ github.workspace }}/dist/agent-toolkit
          ATK_CAPTURE: '1'
          ATK_CAPTURE_DIR: ${{ runner.temp }}/atk-world-review
          ATK_LIBRARY_CAPTURE_DIR: ${{ runner.temp }}/atk-library-review
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter agent-toolkit-desktop exec playwright test --project=electron e2e/electron/project-link.spec.ts
      - name: Capture playable world visual review
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        env:
          ATK_E2E_BACKEND_BIN: ${{ github.workspace }}/dist/agent-toolkit
          ATK_CAPTURE_WORLD_EXPLORATION: '1'
          ATK_CAPTURE_WORLD_EXPLORATION_DIR: ${{ runner.temp }}/atk-player-review
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter agent-toolkit-desktop exec playwright test --project=electron e2e/electron/world-walk.spec.ts
      - name: Capture destination visual review
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        env:
          ATK_E2E_BACKEND_BIN: ${{ github.workspace }}/dist/agent-toolkit
          ATK_CAPTURE: '1'
          ATK_CAPTURE_DIR: ${{ runner.temp }}/atk-destination-review
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter agent-toolkit-desktop exec playwright test --project=electron e2e/electron/capture.spec.ts
      - name: Capture People session visual review
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        env:
          ATK_E2E_BACKEND_BIN: ${{ github.workspace }}/dist/agent-toolkit
          ATK_CAPTURE: '1'
          ATK_CAPTURE_DIR: ${{ runner.temp }}/atk-people-review
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter agent-toolkit-desktop exec playwright test --project=electron e2e/electron/people-session.spec.ts
      - name: Capture workspace context pack review
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        env:
          ATK_E2E_BACKEND_BIN: ${{ github.workspace }}/dist/agent-toolkit
          ATK_CAPTURE: '1'
          ATK_CAPTURE_DIR: ${{ runner.temp }}/atk-workspace-packs-review
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter agent-toolkit-desktop exec playwright test --project=electron e2e/electron/workspace-packs.spec.ts
      - name: Capture swarm attention visual review
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        env:
          ATK_E2E_BACKEND_BIN: ${{ github.workspace }}/dist/agent-toolkit
          ATK_CAPTURE: '1'
          ATK_CAPTURE_DIR: ${{ runner.temp }}/atk-attention-review
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter agent-toolkit-desktop exec playwright test --project=electron e2e/electron/desktop.spec.ts
          --grep "swarm plan approval gates"
      - name: Capture Person import review
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        env:
          ATK_E2E_BACKEND_BIN: ${{ github.workspace }}/dist/agent-toolkit
          ATK_CAPTURE: '1'
          ATK_PALETTE_CAPTURE_DIR: ${{ runner.temp }}/atk-import-review
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter agent-toolkit-desktop exec playwright test --project=electron e2e/electron/desktop.spec.ts
          --grep "palette reaches Person creation and Munder import review without saving or spawning"
      - name: Verify world review screenshots
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        run: |
          set -euo pipefail
          for screenshot in \
            world-empty-compact.png world-empty-large.png \
            world-one-project-compact.png world-one-project-large.png \
            world-several-projects-meadow-compact.png world-several-projects-meadow-large.png \
            world-several-projects-dusk-compact.png world-several-projects-dusk-large.png \
            project-files-room-compact.png project-files-room-large.png; do
            test -s "${{ runner.temp }}/atk-world-review/$screenshot"
          done
          test -s "${{ runner.temp }}/atk-player-review/world-player-walking-compact.png"
          test -s "${{ runner.temp }}/atk-player-review/world-player-click-to-move-compact.png"
          test -s "${{ runner.temp }}/atk-player-review/world-player-click-to-move-large.png"
          test -s "${{ runner.temp }}/atk-library-review/copilot-project-review-compact.png"
          test -s "${{ runner.temp }}/atk-library-review/copilot-project-review-large.png"
          test -s "${{ runner.temp }}/atk-import-review/munder-review-compact.png"
          for screenshot in \
            meadow-1024x640-world.png meadow-1920x1080-world.png \
            meadow-1920x1080-library.png meadow-1920x1080-operations.png \
            meadow-1920x1080-people.png meadow-1920x1080-terminal.png \
            dusk-1920x1080-world.png; do
            test -s "${{ runner.temp }}/atk-destination-review/$screenshot"
          done
          for screenshot in people-roster-compact.png people-roster-large.png person-start-compact.png person-start-large.png; do
            test -s "${{ runner.temp }}/atk-people-review/$screenshot"
          done
          for screenshot in attention-swarm-gate-compact.png attention-swarm-gate-large.png; do
          test -s "${{ runner.temp }}/atk-attention-review/$screenshot"
          done
          for screenshot in workspace-packs-compact.png workspace-packs-large.png; do
            test -s "${{ runner.temp }}/atk-workspace-packs-review/$screenshot"
          done
      - name: Capture MCP credential review
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        env:
          ATK_E2E_BACKEND_BIN: ${{ github.workspace }}/dist/agent-toolkit
          ATK_CAPTURE: '1'
          ATK_CAPTURE_DIR: test-results/review
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter agent-toolkit-desktop exec playwright test --project=electron e2e/electron/desktop.spec.ts
          --grep "Library configures MCP providers"
      - name: Stage screenshots for visual review
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.capture_visual_review == 'true'
        run: |
          mkdir -p apps/desktop/test-results/review
          for directory in \
            "${{ runner.temp }}/atk-world-review" \
            "${{ runner.temp }}/atk-player-review" \
            "${{ runner.temp }}/atk-library-review" \
            "${{ runner.temp }}/atk-import-review" \
            "${{ runner.temp }}/atk-destination-review" \
            "${{ runner.temp }}/atk-people-review" \
            "${{ runner.temp }}/atk-workspace-packs-review" \
            "${{ runner.temp }}/atk-attention-review"; do
            for screenshot in "$directory"/*.png; do
              if test -s "$screenshot"; then
                cp "$screenshot" apps/desktop/test-results/review/
              fi
            done
          done
          for screenshot in \
            docs/desktop/assets/electron/library/mcp-configure-compact.png \
            docs/desktop/assets/electron/library/mcp-configure-large.png \
            docs/desktop/assets/electron/library/mcp-credentials-compact.png \
            docs/desktop/assets/electron/library/mcp-credentials-large.png; do
            if test -s "$screenshot"; then
              cp "$screenshot" apps/desktop/test-results/review/
            fi
          done
      - name: E2E (Electron + real backend)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.capture_visual_review != 'true'
        env:
          ATK_E2E_BACKEND_BIN: ${{ github.workspace }}/dist/agent-toolkit
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter agent-toolkit-desktop exec playwright test --project=electron
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7
      - name: Upload Electron review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electron-review-screenshots
          path: apps/desktop/test-results/review
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm --filter agent-toolkit-desktop dist:dir
