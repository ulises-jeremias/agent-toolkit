name: Update Upstream

# Per ADR-0001, full automated update discovery + PR creation is split to a follow-up issue.
# This workflow currently validates offline provenance integrity (declaration ↔ lock ↔ vendored bytes ↔ docs).
# Network-dependent discovery (resolving tracking refs via GitHub API, opening PRs) will be added
# when `scripts/provenance.py updates` is implemented.

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC — currently offline check only
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  provenance-integrity:
    name: Provenance Integrity (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync --all-extras
      - name: Validate upstream declarations (immutable refs, SPDX)
        run: uv run python scripts/validate-upstream.py --check
      - name: Check lock ↔ declaration ↔ vendored bytes (offline)
        run: uv run python scripts/provenance.py check
      - name: Check lock is deterministic from declarations
        run: uv run python scripts/provenance.py lock --check
      - name: Check generated UPSTREAM.md
        run: uv run python scripts/provenance.py docs --check
