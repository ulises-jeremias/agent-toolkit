name: Update Upstream

# Per ADR-0001 and #428: automated discovery of upstream HEAD vs locked commit.
# This workflow is network-dependent (resolves tracking refs via GitHub API) and
# opens a PR with security-reviewable body when updates are available.
# Offline integrity remains in validate.yml (provenance check).

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    name: Discover upstream updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync --all-extras
      - name: Check for upstream updates (online)
        id: updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv run python scripts/provenance.py updates --json > /tmp/updates.json
          cat /tmp/updates.json
          COUNT=$(python3 -c "import json; print(json.load(open('/tmp/updates.json'))['count'])")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "Updates available — workflow would open PR (see #428 lifecycle)."
            # For #428 foundation, we only report; full PR creation (branch → lock → vendored → docs → audit → tests → open PR)
            # will be added when vendored update automation is complete. For now, fail to signal update.
            # Uncomment below to auto-create PR via create-pull-request when ready:
            # echo "PR creation not yet enabled — see #428"
          else
            echo "No updates — all locked commits at remote HEAD."
          fi
      - name: Check staleness (>90d) and license/security (offline)
        run: uv run python scripts/provenance.py check
