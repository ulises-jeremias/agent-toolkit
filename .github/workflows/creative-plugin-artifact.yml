name: Creative Studio generated artifact

on:
  push:
    branches:
      - fix/creative-studio-plugin-resources

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned V
        uses: ./.github/actions/setup-v
      - name: Build CLI
        env:
          VMODULES: ${{ github.workspace }}/modules
        run: ./make.vsh build-cli
      - name: Generate and verify Creative Studio plugin
        env:
          AGENT_TOOLKIT_ROOT: ${{ github.workspace }}
        run: |
          ./build/agent-toolkit build --target agent-plugins --product agent-toolkit-creative-studio --output plugins
          ./build/agent-toolkit build --check --target agent-plugins --product agent-toolkit-creative-studio
      - name: Upload generated plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: creative-studio-plugin
          path: plugins/agent-toolkit-creative-studio/
          retention-days: 2
