name: Daily Driver Evidence Integrity

on:
  pull_request:
    paths:
      - 'docs/desktop/daily-driver-evidence.json'
      - 'scripts/validate-daily-driver-evidence.mjs'
      - 'scripts/validate-daily-driver-evidence.test.mjs'
      - 'scripts/tests/daily-driver-evidence.test.mjs'
      - 'scripts/daily-driver-fixture.mjs'
      - 'scripts/tests/daily-driver-fixture.test.mjs'
      - '.github/workflows/daily-driver-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'docs/desktop/daily-driver-evidence.json'
      - 'scripts/validate-daily-driver-evidence.mjs'
      - 'scripts/validate-daily-driver-evidence.test.mjs'
      - 'scripts/tests/daily-driver-evidence.test.mjs'
      - 'scripts/daily-driver-fixture.mjs'
      - 'scripts/tests/daily-driver-fixture.test.mjs'
      - '.github/workflows/daily-driver-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evidence:
    name: Validate Gate 0 evidence ledger (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Reject unsupported acceptance claims
        run: node --test scripts/tests/daily-driver-evidence.test.mjs scripts/tests/daily-driver-fixture.test.mjs scripts/validate-daily-driver-evidence.test.mjs
      - name: Validate current unverified baseline
        run: node scripts/validate-daily-driver-evidence.mjs docs/desktop/daily-driver-evidence.json
