name: Release

# Sole automated PyPI publish path for version tags (v*).
# Manual republish of an already-tagged VERSION (no retag): workflow_dispatch this
# file — PyPI Trusted Publishing is registered for release.yml, not publish.yml.
#
# Job graph:
#   create-release (draft) ─┬─► build-binaries ─► upload-assets ─┬─► publish-pypi (same-run, checksummed artifact)
#                           │                                    └─► docker (same-run, checksummed artifact)
#                           └─► sbom ──────────────────────────────► publish-release (make public after all gates pass)

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/setup-v/**"
      - "scripts/release-linkage.sh"
      - "cmd/agent-toolkit/**"
      - "apps/desktop/**"
      - "pnpm-lock.yaml"
      - "modules/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target (Trusted Publishing is registered for release.yml)"
        required: true
        default: "pypi"
        type: choice
        options: [pypi, testpypi]
      version:
        description: "Existing tagged version to republish from this workflow revision"
        required: true
        type: string
      source_run_id:
        description: "Optional failed tag-push Actions run ID whose retained binaries/SBOM should be recovered"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          # Keep downloads unavailable until every platform artifact and package
          # has completed. publish-release flips this only after all release jobs pass.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Wait until release API is readable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "✓ Release $TAG is visible via API"
              exit 0
            fi
            echo "Attempt $attempt/30: release not visible yet..."
            sleep 5
          done
          echo "::error::Release $TAG never became visible"
          exit 1

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: [create-release, upload-assets]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pinned V
        uses: ./.github/actions/setup-v

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: release-assets
      - name: Verify same-run release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          python3 scripts/validate_release_assets.py release-assets \
            --version "$VERSION" --tag "$GITHUB_REF_NAME" --source-sha "$SOURCE_SHA"
          mkdir -p binaries
          cp release-assets/agent-toolkit-* binaries/
      - name: Pack sdist + platform wheels (manylinux_2_38)
        run: |
          set -euo pipefail
          ./scripts/prepare-package-data.vsh
          export RELEASE_BIN_DIR=binaries
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          export RELEASE_OUT_DIR=dist
          ./scripts/pack_pypi.vsh
          ls -lh dist/
          python3 - <<'PY'
          from pathlib import Path
          wheels = [p.name for p in Path("dist").glob("*.whl")]
          print(wheels)
          bad = [n for n in wheels if "linux_x86_64" in n and "manylinux" not in n]
          if bad:
              raise SystemExit(f"raw linux_x86_64 tag (PyPI will reject): {bad}")
          if not any("manylinux_2_38_x86_64" in n for n in wheels):
              raise SystemExit("missing manylinux_2_38_x86_64 wheel")
          PY
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
      - name: Verify PyPI shows this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 24); do
            LATEST=$(curl -fsSL "https://pypi.org/pypi/agent-toolkit-cli/json" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "")
            if [ "$LATEST" = "$VERSION" ]; then
              echo "✓ PyPI latest is $LATEST"
              exit 0
            fi
            # Also accept if this version exists even when not "latest" (yanked older etc.)
            if curl -fsSL "https://pypi.org/pypi/agent-toolkit-cli/${VERSION}/json" >/dev/null 2>&1; then
              echo "✓ PyPI has agent-toolkit-cli==$VERSION (latest reported: ${LATEST:-unknown})"
              exit 0
            fi
            echo "Attempt $attempt/24: waiting for PyPI (saw '${LATEST:-none}')..."
            sleep 15
          done
          echo "::warning::PyPI verification timed out — publish step succeeded; CDN may lag"

  build-binaries:
    name: Build ${{ matrix.artifact }}
    if: github.event_name == 'push'
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: agent-toolkit-linux-x86_64
            v_zip: v_linux.zip
            bin: agent-toolkit
            expect_arch: x86_64
            build_desktop: false
          - os: ubuntu-24.04-arm
            artifact: agent-toolkit-linux-arm64
            v_zip: v_linux_arm64.zip
            bin: agent-toolkit
            expect_arch: arm64
            build_desktop: false
          - os: macos-latest
            artifact: agent-toolkit-macos-arm64
            v_zip: v_macos_arm64.zip
            bin: agent-toolkit
            expect_arch: arm64
            build_desktop: false
          - os: macos-15-intel
            artifact: agent-toolkit-macos-x86_64
            v_zip: v_macos_x86_64.zip
            bin: agent-toolkit
            expect_arch: x86_64
            build_desktop: false
          - os: windows-latest
            artifact: agent-toolkit-windows-x86_64.exe
            v_zip: v_windows.zip
            bin: agent-toolkit.exe
            expect_arch: x86_64
            build_desktop: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned V
        uses: ./.github/actions/setup-v
        with:
          v_zip: ${{ matrix.v_zip }}

      - name: Build native V CLI
        shell: bash
        env:
          OUT_BIN: ${{ matrix.bin }}
          ASSET: ${{ matrix.artifact }}
          VMODULES: ${{ github.workspace }}/modules
          EXPECT_ARCH: ${{ matrix.expect_arch }}
        run: |
          set -euo pipefail
          got="$(uname -m | tr 'A-Z' 'a-z')"
          case "${got}" in
            aarch64|arm64) got=arm64 ;;
            x86_64|amd64) got=x86_64 ;;
          esac
          if [ "${got}" != "${EXPECT_ARCH}" ]; then
            echo "architecture mismatch: ${got} != ${EXPECT_ARCH}" >&2
            exit 1
          fi
          mkdir -p build
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          # Release link flags + portability gate: single source of truth in
          # scripts/release-linkage.sh (#1199) — never re-inline per-OS flags
          # here, or the linkage-smoke job stops proving the release build.
          VFLAGS="$("${GITHUB_WORKSPACE}/scripts/release-linkage.sh" flags)"
          # shellcheck disable=SC2086
          "${VBIN}" ${VFLAGS} -d "commit=${COMMIT}" -o "build/${OUT_BIN}" cmd/agent-toolkit
          cp -f "build/${OUT_BIN}" "build/${ASSET}"
          "build/${OUT_BIN}" --version
          "build/${OUT_BIN}" --help | head -n 20
          "${GITHUB_WORKSPACE}/scripts/release-linkage.sh" gate "build/${OUT_BIN}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: Archived Toolkit Electron migration-source build (${{ matrix.os }})
    # This only compiles preserved migration source while its user-data and
    # capability disposition is open. It is not a supported desktop product,
    # is never included in a tagged release, and must not produce downloadable
    # PR artifacts. Veasel Code owns the supported graphical runtime.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            v_zip: v_linux.zip
            backend: agent-toolkit
          - os: ubuntu-24.04-arm
            v_zip: v_linux_arm64.zip
            backend: agent-toolkit
          - os: macos-latest
            v_zip: v_macos_arm64.zip
            backend: agent-toolkit
          - os: macos-15-intel
            v_zip: v_macos_x86_64.zip
            backend: agent-toolkit
          - os: windows-latest
            v_zip: v_windows.zip
            backend: agent-toolkit.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Setup pinned V
        uses: ./.github/actions/setup-v
        with:
          v_zip: ${{ matrix.v_zip }}
      - name: Build canonical backend for the package
        shell: bash
        env:
          VMODULES: ${{ github.workspace }}/modules
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          mkdir -p build
          VFLAGS="$("${GITHUB_WORKSPACE}/scripts/release-linkage.sh" flags)"
          # shellcheck disable=SC2086
          "${VBIN}" ${VFLAGS} -d "commit=$(git rev-parse --short HEAD)" -o "build/${BACKEND}" cmd/agent-toolkit
          "build/${BACKEND}" --version
          "${GITHUB_WORKSPACE}/scripts/release-linkage.sh" gate "build/${BACKEND}"
      - name: Compile archived Toolkit Electron source with its matching backend
        shell: bash
        env:
          ATK_BACKEND_BIN: ${{ github.workspace }}/build/${{ matrix.backend }}
        run: pnpm --filter agent-toolkit-desktop dist
      - name: Verify packaged backend version
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          pin = json.loads(Path('apps/desktop/resources/backend-version.json').read_text())['version']
          package = json.loads(Path('apps/desktop/package.json').read_text())['version']
          if version != pin or version != package:
              raise SystemExit(f'version mismatch: source={version}, backend={pin}, desktop={package}')
          print(f'Electron and backend: {version}')
          PYCODE
          find apps/desktop/release -maxdepth 1 -type f -print
  # PR-only proof that the exact release link flags produce portable
  # binaries on every OS. No release environment, no artifacts, no uploads —
  # fails the PR before a broken binary can ever reach a tag build.
  linkage-smoke:
    name: Linkage smoke (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned V
        uses: ./.github/actions/setup-v

      - name: Prod-link CLI with release flags
        shell: bash
        env:
          VMODULES: ${{ github.workspace }}/modules
        run: |
          set -euo pipefail
          mkdir -p build
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          # Flags and gate come from the same helper as the release jobs, so
          # this job proves the exact release build instead of a copy of it.
          LINKAGE_HELPER="${GITHUB_WORKSPACE}/scripts/release-linkage.sh"
          VFLAGS="$("${LINKAGE_HELPER}" flags)"
          CLI_BIN=agent-toolkit
          case "${RUNNER_OS:-}" in
            Windows*) CLI_BIN=agent-toolkit.exe ;;
          esac
          # shellcheck disable=SC2086
          "${VBIN}" ${VFLAGS} -d "commit=${COMMIT}" -o "build/${CLI_BIN}" cmd/agent-toolkit
          # shellcheck disable=SC2086
          "build/${CLI_BIN}" --version
          "${LINKAGE_HELPER}" gate "build/${CLI_BIN}"

  upload-assets:
    name: Attach V binaries, archives, SHA256SUMS, manifest
    if: github.event_name == 'push'
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned V
        uses: ./.github/actions/setup-v

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: binaries/
          merge-multiple: true
      - name: Pack CLI archives + SHA256SUMS + manifest.json
        env:
          RELEASE_BIN_DIR: binaries
          RELEASE_OUT_DIR: release-assets
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/pack_release_assets.vsh
          ls -lh release-assets/
          python3 scripts/validate_release_assets.py release-assets \
            --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" \
            --source-sha "$(git rev-parse HEAD)"
      - name: Upload release assets (retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber; then
              echo "✓ CLI assets attached"
              exit 0
            fi
            echo "Attempt $attempt/10 failed; retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to attach release assets"
          exit 1
      - name: Upload exact release assets for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: Generate SBOM
    if: github.event_name == 'push'
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM with syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-release-assets: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
      - name: Attach SBOM to GitHub Release (retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f sbom.cyclonedx.json
          for attempt in $(seq 1 15); do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
              && gh release upload "${GITHUB_REF_NAME}" sbom.cyclonedx.json --clobber; then
              echo "✓ SBOM attached to ${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "Attempt $attempt/15: release not ready or upload failed; retrying in 8s..."
            sleep 8
          done
          echo "::error::Failed to attach SBOM after retries"
          exit 1

  recover-release-assets:
    name: Recover and validate retained release artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.source_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    outputs:
      source_sha: ${{ steps.recover.outputs.source_sha }}
      tag: ${{ steps.recover.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate recovery inputs
        id: input
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Invalid version"
            exit 1
          }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Source run ID must be numeric"; exit 1; }
          test "$DEPLOY_ENVIRONMENT" = pypi || {
            echo "::error::Artifact recovery requires environment=pypi"
            exit 1
          }
          echo "tag=v${REQUESTED_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.input.outputs.tag }}
          path: source
          fetch-depth: 0
      - name: Setup pinned V
        uses: ./source/.github/actions/setup-v
      - name: Recover source-run binaries and SBOM
        id: recover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v${REQUESTED_VERSION}"
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          SOURCE_VERSION="$(git -C source show "${SOURCE_SHA}:VERSION" | tr -d '[:space:]')"
          test "$SOURCE_VERSION" = "$REQUESTED_VERSION" || {
            echo "::error::Tag VERSION does not match requested version"
            exit 1
          }
          python3 scripts/recover_release_artifacts.py \
            --repository "$GH_REPOSITORY" --run-id "$SOURCE_RUN_ID" \
            --version "$REQUESTED_VERSION" --source-sha "$SOURCE_SHA" --output recovered
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Pack and verify release assets from recovered binaries
        working-directory: source
        env:
          RELEASE_BIN_DIR: ../recovered/binaries
          RELEASE_OUT_DIR: ../release-assets
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.recover.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/pack_release_assets.vsh
          python3 ../scripts/validate_release_assets.py ../release-assets \
            --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --source-sha "$(git rev-parse HEAD)"
      - name: Verify existing draft and restore binaries and SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.recover.outputs.tag }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GH_REPOSITORY}/releases?per_page=100" \
            --paginate --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)"
          test -n "$release_id" || { echo "::error::No existing release for $TAG"; exit 1; }
          gh api "repos/${GH_REPOSITORY}/releases/${release_id}" --jq '.draft' \
            | grep -qx true || {
            echo "::error::Recovery only updates an existing draft release"; exit 1;
          }
          gh release upload "$TAG" release-assets/* recovered/sbom.cyclonedx.json --clobber
      - name: Upload verified assets for downstream publication jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 90

  republish-pypi:
    name: Republish to PyPI (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.source_run_id == ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pinned V
        uses: ./.github/actions/setup-v

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Download GitHub Release V binaries for VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid version input"; exit 1; }
          test "$VERSION" = "$REQUESTED_VERSION" || { echo "::error::VERSION ($VERSION) does not match requested version ($REQUESTED_VERSION)"; exit 1; }
          TAG="v${REQUESTED_VERSION}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git merge-base --is-ancestor "$TAG" HEAD || { echo "::error::Tag ${TAG} is not an ancestor of this workflow revision"; exit 1; }
          git diff --quiet "$TAG" HEAD -- . \
            ':(exclude).github/workflows/release.yml' \
            ':(exclude).github/workflows/docker.yml' \
            ':(exclude)Dockerfile' \
            ':(exclude)distribution/docker/README.md' || {
            echo "::error::Product sources differ from ${TAG}; manual republish must use the tagged product tree"; exit 1;
          }
          mkdir -p binaries
          release_id=""
          for page in $(seq 1 100); do
            release_id=$(gh api "repos/${GH_REPO}/releases?per_page=100&page=${page}" --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)
            [ -z "$release_id" ] || break
          done
          test -n "$release_id" || { echo "::error::Release ${TAG} not found (including drafts)"; exit 1; }
          gh api "repos/${GH_REPO}/releases/${release_id}" --jq '.assets[] | select(.name | startswith("agent-toolkit-")) | [.id, .name] | @tsv' \
            | while IFS="$(printf '\t')" read -r asset_id asset_name; do
                test -n "$asset_id" && test -n "$asset_name"
                gh api -H 'Accept: application/octet-stream' "repos/${GH_REPO}/releases/assets/${asset_id}" > "binaries/${asset_name}"
              done
          ls -lh binaries/
      - name: Pack sdist + platform wheels (manylinux_2_38)
        run: |
          set -euo pipefail
          ./scripts/prepare-package-data.vsh
          export RELEASE_BIN_DIR=binaries
          export RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          export RELEASE_OUT_DIR=dist
          ./scripts/pack_pypi.vsh
          ls -lh dist/
          python3 - <<'PY'
          from pathlib import Path
          wheels = [p.name for p in Path("dist").glob("*.whl")]
          print(wheels)
          bad = [n for n in wheels if "linux_x86_64" in n and "manylinux" not in n]
          if bad:
              raise SystemExit(f"raw linux_x86_64 tag (PyPI will reject): {bad}")
          if not any("manylinux_2_38_x86_64" in n for n in wheels):
              raise SystemExit("missing manylinux_2_38_x86_64 wheel")
          PY
      - name: Publish (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
          repository-url: ${{ inputs.environment == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
      - name: Verify PyPI shows this version
        if: inputs.environment == 'pypi'
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          for attempt in $(seq 1 24); do
            if curl -fsSL "https://pypi.org/pypi/agent-toolkit-cli/${VERSION}/json" >/dev/null 2>&1; then
              echo "✓ PyPI has agent-toolkit-cli==$VERSION"
              exit 0
            fi
            echo "Attempt $attempt/24: waiting for PyPI..."
            sleep 15
          done
          echo "::warning::PyPI verification timed out — publish step succeeded; CDN may lag"

  recover-pypi:
    name: Publish recovered artifacts to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.source_run_id != ''
    needs: [recover-release-assets]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.recover-release-assets.outputs.tag }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Setup pinned V
        uses: ./source/.github/actions/setup-v
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: release-assets
      - name: Verify recovered assets and prepare PyPI package
        working-directory: source
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.recover-release-assets.outputs.tag }}
          SOURCE_SHA: ${{ needs.recover-release-assets.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 ../scripts/validate_release_assets.py ../release-assets \
            --version "$VERSION" --tag "$TAG" --source-sha "$SOURCE_SHA"
          mkdir -p binaries
          cp ../release-assets/agent-toolkit-* binaries/
          ./scripts/prepare-package-data.vsh
          export RELEASE_BIN_DIR=binaries
          export RELEASE_VERSION="$VERSION"
          export RELEASE_OUT_DIR=dist
          ./scripts/pack_pypi.vsh
          ls -lh dist/
          python3 - <<'PY'
          from pathlib import Path
          wheels = [p.name for p in Path("dist").glob("*.whl")]
          if any("linux_x86_64" in n and "manylinux" not in n for n in wheels):
              raise SystemExit(f"raw linux_x86_64 tag (PyPI will reject): {wheels}")
          if not any("manylinux_2_38_x86_64" in n for n in wheels):
              raise SystemExit("missing manylinux_2_38_x86_64 wheel")
          PY
      - name: Publish recovered package (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
      - name: Install pinned PyPI metadata version parser
        run: python3 -m pip install --disable-pip-version-check --no-input packaging==26.4
      - name: Verify PyPI shows recovered version
        working-directory: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl -fsSL "https://pypi.org/pypi/agent-toolkit-cli/${VERSION}/json" -o pypi-version.json; then
              if python3 ../scripts/verify_pypi_files.py dist pypi-version.json --version "$VERSION"; then
                exit 0
              fi
            fi
            echo "Attempt $attempt/24: PyPI files are not yet an exact match"
            sleep 15
          done
          echo "::error::PyPI file names/digests did not exactly match local distributions for ${VERSION}"
          exit 1

  docker:
    name: Docker image
    if: github.event_name == 'push'
    needs: [upload-assets]
    uses: ./.github/workflows/docker.yml
    with:
      # Caller github.event_name stays "push"; docker.yml must not gate on
      # event_name == workflow_call (that never matches).
      publish: true
      use_run_artifact: true
    permissions:
      contents: write
      packages: write

  docker-manual:
    name: Docker image (manual recovery)
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'pypi' && inputs.source_run_id == ''
    needs: [republish-pypi]
    uses: ./.github/workflows/docker.yml
    with:
      publish: true
    permissions:
      contents: write
      packages: write

  docker-recovery:
    name: Docker image (recovered artifact run)
    if: github.event_name == 'workflow_dispatch' && inputs.source_run_id != ''
    needs: [recover-release-assets, recover-pypi]
    uses: ./.github/workflows/docker.yml
    with:
      publish: true
      use_run_artifact: true
      version: ${{ inputs.version }}
      source_sha: ${{ needs.recover-release-assets.outputs.source_sha }}
    permissions:
      contents: write
      packages: write

  publish-release:
    name: Publish verified GitHub Release
    if: github.event_name == 'push'
    needs: [upload-assets, sbom, publish-pypi, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish only after every distribution gate passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_id=""
          for page in $(seq 1 100); do
            release_id=$(gh api "repos/${GH_REPO}/releases?per_page=100&page=${page}" --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)
            [ -z "$release_id" ] || break
          done
          test -n "$release_id" || { echo "::error::Release ${TAG} not found"; exit 1; }
          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" -F draft=false --jq '.draft' | grep -qx false
          draft=$(gh api "repos/${GH_REPO}/releases/${release_id}" --jq '.draft')
          test "$draft" = false || { echo "::error::Release ${TAG} remains a draft"; exit 1; }
          echo "✓ Published $TAG after binary, SBOM, PyPI, and Docker jobs passed"

  publish-release-manual:
    name: Publish recovered GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'pypi' && inputs.source_run_id == ''
    needs: [republish-pypi, docker-manual]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish only after manual PyPI and Docker gates pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v${REQUESTED_VERSION}"
          release_id=""
          for page in $(seq 1 100); do
            release_id=$(gh api "repos/${GH_REPO}/releases?per_page=100&page=${page}" --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)
            [ -z "$release_id" ] || break
          done
          test -n "$release_id" || { echo "::error::Release ${TAG} not found"; exit 1; }
          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" -F draft=false --jq '.draft' | grep -qx false
          draft=$(gh api "repos/${GH_REPO}/releases/${release_id}" --jq '.draft')
          test "$draft" = false || { echo "::error::Release ${TAG} remains a draft"; exit 1; }
          echo "✓ Published ${TAG} after manual PyPI and Docker jobs passed"

  publish-release-recovery:
    name: Publish recovered GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.source_run_id != ''
    needs: [recover-release-assets, recover-pypi, docker-recovery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish only after recovered PyPI and Docker gates pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.recover-release-assets.outputs.tag }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GH_REPOSITORY}/releases?per_page=100" \
            --paginate --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)"
          test -n "$release_id" || { echo "::error::Release ${TAG} not found"; exit 1; }
          gh api "repos/${GH_REPOSITORY}/releases/${release_id}" --jq '.draft' \
            | grep -qx true || {
            echo "::error::Refusing recovery publication: release is not a draft"; exit 1;
          }
          gh api --method PATCH "repos/${GH_REPOSITORY}/releases/${release_id}" \
            -F draft=false --jq '.draft' | grep -qx false
          gh api "repos/${GH_REPOSITORY}/releases/${release_id}" --jq '.draft' | grep -qx false
          echo "✓ Published ${TAG} after recovered binaries, SBOM, PyPI, and Docker gates passed"
