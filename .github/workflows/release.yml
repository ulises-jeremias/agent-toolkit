name: Release

# Sole automated PyPI publish path for version tags (v*).
# Manual republish of an already-tagged VERSION (no retag): workflow_dispatch this
# file — PyPI Trusted Publishing is registered for release.yml, not publish.yml.
#
# Job graph:
#   create-release ─┬─► build-binaries ─► upload-assets ─┬─► publish-pypi (platform wheels from Release assets)
#                   │                                    └─► docker (reusable workflow; GITHUB_TOKEN cannot trigger on: release)
#                   └─► sbom (SHOULD CycloneDX; does not prove “secure software”)

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/setup-v/**"
      - "scripts/release-linkage.sh"
      - "cmd/agent-toolkit/**"
      - "apps/desktop/**"
      - "pnpm-lock.yaml"
      - "modules/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target (Trusted Publishing is registered for release.yml)"
        required: true
        default: "pypi"
        type: choice
        options: [pypi, testpypi]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Wait until release API is readable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "✓ Release $TAG is visible via API"
              exit 0
            fi
            echo "Attempt $attempt/30: release not visible yet..."
            sleep 5
          done
          echo "::error::Release $TAG never became visible"
          exit 1

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: [create-release, upload-assets]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned V
        uses: ./.github/actions/setup-v

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Download GitHub Release V binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p binaries
          gh release download "${GITHUB_REF_NAME}" -D binaries -p 'agent-toolkit-*'
          ls -lh binaries/
      - name: Pack sdist + platform wheels (manylinux_2_38)
        run: |
          set -euo pipefail
          ./scripts/prepare-package-data.vsh
          export RELEASE_BIN_DIR=binaries
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          export RELEASE_OUT_DIR=dist
          ./scripts/pack_pypi.vsh
          ls -lh dist/
          python3 - <<'PY'
          from pathlib import Path
          wheels = [p.name for p in Path("dist").glob("*.whl")]
          print(wheels)
          bad = [n for n in wheels if "linux_x86_64" in n and "manylinux" not in n]
          if bad:
              raise SystemExit(f"raw linux_x86_64 tag (PyPI will reject): {bad}")
          if not any("manylinux_2_38_x86_64" in n for n in wheels):
              raise SystemExit("missing manylinux_2_38_x86_64 wheel")
          PY
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
      - name: Verify PyPI shows this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 24); do
            LATEST=$(curl -fsSL "https://pypi.org/pypi/agent-toolkit-cli/json" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "")
            if [ "$LATEST" = "$VERSION" ]; then
              echo "✓ PyPI latest is $LATEST"
              exit 0
            fi
            # Also accept if this version exists even when not "latest" (yanked older etc.)
            if curl -fsSL "https://pypi.org/pypi/agent-toolkit-cli/${VERSION}/json" >/dev/null 2>&1; then
              echo "✓ PyPI has agent-toolkit-cli==$VERSION (latest reported: ${LATEST:-unknown})"
              exit 0
            fi
            echo "Attempt $attempt/24: waiting for PyPI (saw '${LATEST:-none}')..."
            sleep 15
          done
          echo "::warning::PyPI verification timed out — publish step succeeded; CDN may lag"

  build-binaries:
    name: Build ${{ matrix.artifact }}
    if: github.event_name == 'push'
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: agent-toolkit-linux-x86_64
            v_zip: v_linux.zip
            bin: agent-toolkit
            expect_arch: x86_64
            build_desktop: false
          - os: ubuntu-24.04-arm
            artifact: agent-toolkit-linux-arm64
            v_zip: v_linux_arm64.zip
            bin: agent-toolkit
            expect_arch: arm64
            build_desktop: false
          - os: macos-latest
            artifact: agent-toolkit-macos-arm64
            v_zip: v_macos_arm64.zip
            bin: agent-toolkit
            expect_arch: arm64
            build_desktop: false
          - os: macos-15-intel
            artifact: agent-toolkit-macos-x86_64
            v_zip: v_macos_x86_64.zip
            bin: agent-toolkit
            expect_arch: x86_64
            build_desktop: false
          - os: windows-latest
            artifact: agent-toolkit-windows-x86_64.exe
            v_zip: v_windows.zip
            bin: agent-toolkit.exe
            expect_arch: x86_64
            build_desktop: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned V
        uses: ./.github/actions/setup-v
        with:
          v_zip: ${{ matrix.v_zip }}

      - name: Build native V CLI
        shell: bash
        env:
          OUT_BIN: ${{ matrix.bin }}
          ASSET: ${{ matrix.artifact }}
          VMODULES: ${{ github.workspace }}/modules
          EXPECT_ARCH: ${{ matrix.expect_arch }}
        run: |
          set -euo pipefail
          got="$(uname -m | tr 'A-Z' 'a-z')"
          case "${got}" in
            aarch64|arm64) got=arm64 ;;
            x86_64|amd64) got=x86_64 ;;
          esac
          if [ "${got}" != "${EXPECT_ARCH}" ]; then
            echo "architecture mismatch: ${got} != ${EXPECT_ARCH}" >&2
            exit 1
          fi
          mkdir -p build
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          # Release link flags + portability gate: single source of truth in
          # scripts/release-linkage.sh (#1199) — never re-inline per-OS flags
          # here, or the linkage-smoke job stops proving the release build.
          VFLAGS="$("${GITHUB_WORKSPACE}/scripts/release-linkage.sh" flags)"
          # shellcheck disable=SC2086
          "${VBIN}" ${VFLAGS} -d "commit=${COMMIT}" -o "build/${OUT_BIN}" cmd/agent-toolkit
          cp -f "build/${OUT_BIN}" "build/${ASSET}"
          "build/${OUT_BIN}" --version
          "build/${OUT_BIN}" --help | head -n 20
          "${GITHUB_WORKSPACE}/scripts/release-linkage.sh" gate "build/${OUT_BIN}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: Package Electron Desktop (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            v_zip: v_linux.zip
            backend: agent-toolkit
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            v_zip: v_linux_arm64.zip
            backend: agent-toolkit
          - os: macos-latest
            artifact: macos-arm64
            v_zip: v_macos_arm64.zip
            backend: agent-toolkit
          - os: macos-15-intel
            artifact: macos-x86_64
            v_zip: v_macos_x86_64.zip
            backend: agent-toolkit
          - os: windows-latest
            artifact: windows-x86_64
            v_zip: v_windows.zip
            backend: agent-toolkit.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Setup pinned V
        uses: ./.github/actions/setup-v
        with:
          v_zip: ${{ matrix.v_zip }}
      - name: Build canonical backend for the package
        shell: bash
        env:
          VMODULES: ${{ github.workspace }}/modules
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          mkdir -p build
          VFLAGS="$("${GITHUB_WORKSPACE}/scripts/release-linkage.sh" flags)"
          # shellcheck disable=SC2086
          "${VBIN}" ${VFLAGS} -d "commit=$(git rev-parse --short HEAD)" -o "build/${BACKEND}" cmd/agent-toolkit
          "build/${BACKEND}" --version
          "${GITHUB_WORKSPACE}/scripts/release-linkage.sh" gate "build/${BACKEND}"
      - name: Package Electron with its matching backend
        shell: bash
        env:
          ATK_BACKEND_BIN: ${{ github.workspace }}/build/${{ matrix.backend }}
        run: pnpm --filter agent-toolkit-desktop dist
      - name: Verify packaged backend version
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          pin = json.loads(Path('apps/desktop/resources/backend-version.json').read_text())['version']
          package = json.loads(Path('apps/desktop/package.json').read_text())['version']
          if version != pin or version != package:
              raise SystemExit(f'version mismatch: source={version}, backend={pin}, desktop={package}')
          print(f'Electron and backend: {version}')
          PYCODE
          find apps/desktop/release -maxdepth 1 -type f -print
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  # PR-only proof that the exact release link flags produce portable
  # binaries on every OS. No release environment, no artifacts, no uploads —
  # fails the PR before a broken binary can ever reach a tag build.
  linkage-smoke:
    name: Linkage smoke (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned V
        uses: ./.github/actions/setup-v

      - name: Prod-link CLI with release flags
        shell: bash
        env:
          VMODULES: ${{ github.workspace }}/modules
        run: |
          set -euo pipefail
          mkdir -p build
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          # Flags and gate come from the same helper as the release jobs, so
          # this job proves the exact release build instead of a copy of it.
          LINKAGE_HELPER="${GITHUB_WORKSPACE}/scripts/release-linkage.sh"
          VFLAGS="$("${LINKAGE_HELPER}" flags)"
          CLI_BIN=agent-toolkit
          case "${RUNNER_OS:-}" in
            Windows*) CLI_BIN=agent-toolkit.exe ;;
          esac
          # shellcheck disable=SC2086
          "${VBIN}" ${VFLAGS} -d "commit=${COMMIT}" -o "build/${CLI_BIN}" cmd/agent-toolkit
          # shellcheck disable=SC2086
          "build/${CLI_BIN}" --version
          "${LINKAGE_HELPER}" gate "build/${CLI_BIN}"

  upload-assets:
    name: Attach V binaries, archives, SHA256SUMS, manifest
    if: github.event_name == 'push'
    needs: [create-release, build-binaries, build-desktop]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned V
        uses: ./.github/actions/setup-v

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: binaries/
          merge-multiple: true
      - name: Pack CLI archives + SHA256SUMS + manifest.json
        env:
          RELEASE_BIN_DIR: binaries
          RELEASE_OUT_DIR: release-assets
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/pack_release_assets.vsh
          cp binaries/agent-toolkit-desktop-* release-assets/
          sha256sum release-assets/agent-toolkit-desktop-* | sed 's#release-assets/##' >> release-assets/SHA256SUMS
          sort -k2,2 -o release-assets/SHA256SUMS release-assets/SHA256SUMS
          ls -lh release-assets/
      - name: Upload release assets (retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber; then
              echo "✓ CLI and Electron Desktop assets attached"
              exit 0
            fi
            echo "Attempt $attempt/10 failed; retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to attach release assets"
          exit 1

  sbom:
    name: Generate SBOM
    if: github.event_name == 'push'
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM with syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-release-assets: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
      - name: Attach SBOM to GitHub Release (retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f sbom.cyclonedx.json
          for attempt in $(seq 1 15); do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
              && gh release upload "${GITHUB_REF_NAME}" sbom.cyclonedx.json --clobber; then
              echo "✓ SBOM attached to ${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "Attempt $attempt/15: release not ready or upload failed; retrying in 8s..."
            sleep 8
          done
          echo "::error::Failed to attach SBOM after retries"
          exit 1

  republish-pypi:
    name: Republish to PyPI (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned V
        uses: ./.github/actions/setup-v

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Download GitHub Release V binaries for VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p binaries
          gh release download "v${VERSION}" -D binaries -p 'agent-toolkit-*'
          ls -lh binaries/
      - name: Pack sdist + platform wheels (manylinux_2_38)
        run: |
          set -euo pipefail
          ./scripts/prepare-package-data.vsh
          export RELEASE_BIN_DIR=binaries
          export RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          export RELEASE_OUT_DIR=dist
          ./scripts/pack_pypi.vsh
          ls -lh dist/
          python3 - <<'PY'
          from pathlib import Path
          wheels = [p.name for p in Path("dist").glob("*.whl")]
          print(wheels)
          bad = [n for n in wheels if "linux_x86_64" in n and "manylinux" not in n]
          if bad:
              raise SystemExit(f"raw linux_x86_64 tag (PyPI will reject): {bad}")
          if not any("manylinux_2_38_x86_64" in n for n in wheels):
              raise SystemExit("missing manylinux_2_38_x86_64 wheel")
          PY
      - name: Publish (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
          repository-url: ${{ inputs.environment == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
      - name: Verify PyPI shows this version
        if: inputs.environment == 'pypi'
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          for attempt in $(seq 1 24); do
            if curl -fsSL "https://pypi.org/pypi/agent-toolkit-cli/${VERSION}/json" >/dev/null 2>&1; then
              echo "✓ PyPI has agent-toolkit-cli==$VERSION"
              exit 0
            fi
            echo "Attempt $attempt/24: waiting for PyPI..."
            sleep 15
          done
          echo "::warning::PyPI verification timed out — publish step succeeded; CDN may lag"

  docker:
    name: Docker image
    if: github.event_name == 'push'
    needs: [upload-assets]
    uses: ./.github/workflows/docker.yml
    with:
      # Caller github.event_name stays "push"; docker.yml must not gate on
      # event_name == workflow_call (that never matches).
      publish: true
    permissions:
      contents: read
      packages: write
