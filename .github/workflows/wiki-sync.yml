name: Sync Wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone wiki repo
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-repo || {
            echo "Wiki not initialized yet — skipping sync"
            echo "To initialize: go to https://github.com/${{ github.repository }}/wiki and create the first page"
            exit 0
          }

      - name: Sync docs/wiki to GitHub Wiki
        run: |
          [ -d wiki-repo ] || exit 0
          cp docs/wiki/*.md wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "sync: update wiki from docs/wiki [skip ci]"
          git push
          echo "✓ Wiki synced"
