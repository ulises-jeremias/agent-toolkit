name: Sync Wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync wiki
        uses: nicowillis/github-wiki-publish-action@v1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: docs/wiki
