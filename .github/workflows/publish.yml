name: Publish (manual)

# Manual-only publishing. Tag releases publish exclusively via release.yml.
# Keeping this workflow prevents accidental double-publish when a GitHub
# Release is created (release.yml already uploads to PyPI on v* tags).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "testpypi"
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read
  id-token: write  # trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned V
        uses: ./.github/actions/setup-v

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Download GitHub Release V binaries for this VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p binaries
          gh release download "v${VERSION}" -D binaries -p 'agent-toolkit-*'
          ls -lh binaries/
      - name: Pack sdist + platform wheels (manylinux_2_38)
        run: |
          set -euo pipefail
          ./scripts/prepare-package-data.vsh
          export RELEASE_BIN_DIR=binaries
          export RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          export RELEASE_OUT_DIR=dist
          ./scripts/pack_pypi.vsh
          ls -lh dist/
          python3 - <<'PY'
          from pathlib import Path
          wheels = [p.name for p in Path("dist").glob("*.whl")]
          print(wheels)
          bad = [n for n in wheels if "linux_x86_64" in n and "manylinux" not in n]
          if bad:
              raise SystemExit(f"raw linux_x86_64 tag (PyPI will reject): {bad}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: ${{ inputs.environment == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
