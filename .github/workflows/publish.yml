name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'testpypi'
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read
  id-token: write  # for trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - run: bash scripts/prepare-package-data.sh && uv build --package agent-toolkit-cli
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'pypi' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.environment == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}

  build-binaries:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv sync --all-extras
      - run: uv pip install pyinstaller
      - name: Build binary
        run: |
          uv run pyinstaller \
            --onefile \
            --name agent-toolkit \
            --add-data "skills:skills" \
            --add-data "agents:agents" \
            --add-data "loops:loops" \
            --add-data "profiles:profiles" \
            --add-data "mcp:mcp" \
            packages/agent-toolkit-cli/src/agent_toolkit/cli/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent-toolkit-${{ matrix.os }}
          path: dist/agent-toolkit*
