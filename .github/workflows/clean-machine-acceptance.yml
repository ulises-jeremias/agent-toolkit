name: Clean-machine Desktop Acceptance

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'modules/agent_toolkit_core/**'
      - 'modules/agent_toolkit_server/**'
      - 'cmd/agent-toolkit/**'
      - '.github/workflows/clean-machine-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'modules/agent_toolkit_core/**'
      - 'modules/agent_toolkit_server/**'
      - 'cmd/agent-toolkit/**'
      - '.github/workflows/clean-machine-acceptance.yml'

jobs:
  linux-clean-machine:
    name: Packaged Electron with fresh HOME
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install display and browser dependencies
        run: pnpm --filter agent-toolkit-desktop exec playwright install chromium --with-deps
      - name: Setup pinned V
        uses: ./.github/actions/setup-v
      - name: Build canonical backend
        env:
          VMODULES: ${{ github.workspace }}/modules
        run: |
          set -euo pipefail
          mkdir -p dist
          "${VBIN}" -prod -cc gcc -d "commit=$(git rev-parse --short HEAD)" -o dist/agent-toolkit cmd/agent-toolkit
      - name: Package Electron Desktop
        env:
          ATK_BACKEND_BIN: ${{ github.workspace }}/dist/agent-toolkit
        run: pnpm --filter agent-toolkit-desktop dist:dir
      - name: Verify bundled version and assets
        run: |
          set -euo pipefail
          app=apps/desktop/release/linux-unpacked
          test -x "$app/agent-toolkit-desktop"
          test -x "$app/resources/bin/agent-toolkit"
          test -f "$app/resources/app.asar"
          "$app/resources/bin/agent-toolkit" --version
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          root = Path('apps/desktop')
          version = Path('VERSION').read_text().strip()
          bundle = json.loads((root / 'release/linux-unpacked/resources/backend-version.json').read_text())['version']
          package = json.loads((root / 'package.json').read_text())['version']
          if version != bundle or version != package:
              raise SystemExit(f'version mismatch: source={version}, bundle={bundle}, desktop={package}')
          print(f'packaged Desktop and backend: {version}')
          PYCODE
      - name: Real packaged Electron E2E with isolated HOME
        env:
          ATK_E2E_APP_PATH: ${{ github.workspace }}/apps/desktop/release/linux-unpacked/agent-toolkit-desktop
          ATK_E2E_BACKEND_BIN: ${{ github.workspace }}/apps/desktop/release/linux-unpacked/resources/bin/agent-toolkit
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter agent-toolkit-desktop exec playwright test --project=electron
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-desktop-failure
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore
