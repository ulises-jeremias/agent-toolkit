name: Temporary Creative Studio artifact generation

on:
  push:
    branches: [fix/creative-studio-plugin-resources]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned V
        uses: ./.github/actions/setup-v
      - name: Build CLI and generate Creative Studio plugin
        run: |
          ./make.vsh build-cli
          AGENT_TOOLKIT_ROOT="$GITHUB_WORKSPACE" ./build/agent-toolkit build --target agent-plugins --product agent-toolkit-creative-studio
          ./make.vsh gen-embedded
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: creative-studio-generated
          path: |
            plugins/agent-toolkit-creative-studio/
            modules/agent_toolkit_core/embedded_data.v
          if-no-files-found: error
