[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-toolkit-cli"
dynamic = ["version"]
description = "Composable AI agent toolkit — loops, skills, profiles, and MCP for Claude Code, Cursor, OpenCode, Windsurf, and more"
readme = { file = "../../README.md", content-type = "text/markdown" }
license = { file = "../../LICENSE" }
requires-python = ">=3.10"
keywords = [
    "ai-agents", "claude-code", "cursor", "opencode", "windsurf",
    "github-copilot", "skills", "loops", "mcp", "agent-toolkit"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]
yaml = ["pyyaml>=6.0"]
all = ["pyyaml>=6.0"]

[project.scripts]
agent-toolkit = "agent_toolkit.cli.main:main"
agent-toolkit-cli = "agent_toolkit.cli.main:main"

[project.urls]
Homepage = "https://github.com/ulises-jeremias/agent-toolkit"
Repository = "https://github.com/ulises-jeremias/agent-toolkit.git"
Issues = "https://github.com/ulises-jeremias/agent-toolkit/issues"
Changelog = "https://github.com/ulises-jeremias/agent-toolkit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/agent_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
"../../profiles" = "agent_toolkit/data/profiles"
"../../loops" = "agent_toolkit/data/loops"
"../../skills" = "agent_toolkit/data/skills"
"../../mcp" = "agent_toolkit/data/mcp"
"../../agents" = "agent_toolkit/data/agents"
"../../catalogs" = "agent_toolkit/data/catalogs"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "../../skills/",
    "../../agents/",
    "../../loops/",
    "../../profiles/",
    "../../mcp/",
    "../../agents/",
    "../../catalogs/",
    "../../schemas/",
]
