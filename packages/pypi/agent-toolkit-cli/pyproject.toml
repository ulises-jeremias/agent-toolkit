[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-toolkit-cli"
dynamic = ["version"]
description = "Composable AI agent toolkit — loops, skills, profiles, and MCP for Claude Code, Cursor, OpenCode, Windsurf, and more"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "ai-agents", "claude-code", "cursor", "opencode", "windsurf",
    "github-copilot", "skills", "loops", "mcp", "agent-toolkit", "agent-toolkit-cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No runtime deps — this package is an npm-style trampoline over the bundled V binary.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
# Same idea as packages/npm/agent-toolkit-cli/bin/agent-toolkit.js — exec the V binary.
agent-toolkit = "agent_toolkit.launcher:main"
agent-toolkit-cli = "agent_toolkit.launcher:main"

[project.urls]
Homepage = "https://github.com/ulises-jeremias/agent-toolkit"
Documentation = "https://github.com/ulises-jeremias/agent-toolkit/tree/main/docs"
Repository = "https://github.com/ulises-jeremias/agent-toolkit.git"
Issues = "https://github.com/ulises-jeremias/agent-toolkit/issues"
Changelog = "https://github.com/ulises-jeremias/agent-toolkit/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/agent-toolkit-cli/"

[tool.hatch.version]
path = "src/agent_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_toolkit"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Capability trees are copied into src/agent_toolkit/data/ by
# scripts/prepare-package-data.sh before sdist/wheel builds.
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "hatch_build.py",
    "platforms.json",
]

[tool.coverage.run]
branch = true
source = ["agent_toolkit"]
relative_files = true
omit = ["*/tests/*", "*/__pycache__/*", "*/site-packages/*", "*/data/*"]

[tool.coverage.report]
precision = 1
show_missing = true
fail_under = 70
include = [
    "*/agent_toolkit/launcher.py",
]
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
