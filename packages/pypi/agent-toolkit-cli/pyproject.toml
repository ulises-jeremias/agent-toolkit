[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-toolkit-cli"
dynamic = ["version"]
description = "Composable AI agent toolkit — loops, skills, profiles, and MCP for Claude Code, Cursor, OpenCode, Windsurf, and more"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "ai-agents", "claude-code", "cursor", "opencode", "windsurf",
    "github-copilot", "skills", "loops", "mcp", "agent-toolkit", "agent-toolkit-cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
]
yaml = ["pyyaml>=6.0"]
all = ["pyyaml>=6.0"]

[project.scripts]
agent-toolkit = "agent_toolkit.launcher:main"
agent-toolkit-cli = "agent_toolkit.launcher:main"
agent-toolkit-py = "agent_toolkit.cli.main:main"

[project.urls]
Homepage = "https://github.com/ulises-jeremias/agent-toolkit"
Documentation = "https://github.com/ulises-jeremias/agent-toolkit/tree/main/docs"
Repository = "https://github.com/ulises-jeremias/agent-toolkit.git"
Issues = "https://github.com/ulises-jeremias/agent-toolkit/issues"
Changelog = "https://github.com/ulises-jeremias/agent-toolkit/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/agent-toolkit-cli/"

[tool.hatch.version]
path = "src/agent_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_toolkit"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Capability trees are copied into src/agent_toolkit/data/ by
# scripts/prepare-package-data.sh before sdist/wheel builds. Editable
# installs resolve monorepo root via agent_toolkit._paths (no packed data).
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "hatch_build.py",
    "platforms.json",
]

[tool.coverage.run]
branch = true
source = ["agent_toolkit"]
relative_files = true
omit = ["*/tests/*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
precision = 1
show_missing = true
# Scoped gate (#271): compiler + installer + cli/install.py only.
fail_under = 70
include = [
    "*/agent_toolkit/compiler/*",
    "*/agent_toolkit/installer/*",
    "*/agent_toolkit/cli/install.py",
]
skip_covered = false

[tool.mypy]
python_version = "3.10"
# Incremental typing (#275): narrow, warn-only in CI.
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
