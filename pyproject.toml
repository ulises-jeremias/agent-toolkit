# uv workspace root — not published to PyPI.
# Published package: packages/agent-toolkit-cli (name: agent-toolkit-cli)

[project]
name = "agent-toolkit"
version = "0.0.0"
description = "uv workspace root for the agent-toolkit monorepo"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "agent-toolkit-cli",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/agent-toolkit-cli"]

[tool.uv.sources]
agent-toolkit-cli = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["packages/agent-toolkit-cli/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["packages/agent-toolkit-cli/src"]
