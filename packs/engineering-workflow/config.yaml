# Engineering Workflow Pack Configuration
# Copy this file to your workspace and customize loop cadence or disable components.
#
# Usage:
#   cp packs/engineering-workflow/config.yaml ~/.ai-workspace/packs/engineering-workflow.yaml
#
# See packs/engineering-workflow/README.md for full setup instructions.

pack: engineering-workflow
version: "1.0"

# ---------------------------------------------------------------------------
# Skills
# ---------------------------------------------------------------------------
# Domain/path IDs matching catalogs/skill-catalog.yaml.

skills:
  forge/workflow-generic-project:
    enabled: true
  delivery/development-workflow:
    enabled: true
  forge/gh-contribution-planner:
    enabled: true

# ---------------------------------------------------------------------------
# Agents
# ---------------------------------------------------------------------------

agents:
  architect:
    enabled: true
  planner:
    enabled: true
  code-reviewer:
    enabled: true
  security-reviewer:
    enabled: true

# ---------------------------------------------------------------------------
# Loop settings
# ---------------------------------------------------------------------------
# Each loop can be individually enabled/disabled. Settings override defaults
# in loops/<name>/loop.yaml.

loops:
  pr-babysitter:
    enabled: true
    cadence: 15m

  ci-sweeper:
    enabled: true
    cadence: 15m
