<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <!-- Hex grid pattern -->
    <pattern id="hexgrid" x="0" y="0" width="40" height="35" patternUnits="userSpaceOnUse">
      <polygon points="20,1 38,11 38,31 20,41 2,31 2,11" fill="none" stroke="#0a0a2a" stroke-width="0.6" opacity="0.5"/>
    </pattern>

    <!-- Scanlines -->
    <pattern id="scanlines" x="0" y="0" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000008" opacity="0.15"/>
    </pattern>

    <!-- Neon green glow -->
    <filter id="glow-green" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyan glow -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Box glow for L1.5 -->
    <filter id="box-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- L1.5 ambient box glow -->
    <filter id="box-ambient" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyan line glow -->
    <filter id="line-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="l1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#060e20"/>
    </linearGradient>

    <linearGradient id="l15-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002218"/>
      <stop offset="50%" stop-color="#003822"/>
      <stop offset="100%" stop-color="#002218"/>
    </linearGradient>

    <linearGradient id="l3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#060e20"/>
    </linearGradient>

    <!-- Radial glow for L1.5 -->
    <radialGradient id="l15-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <!-- Tool colors -->
    <linearGradient id="tool-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="900" height="500" fill="#050510"/>
  <rect width="900" height="500" fill="url(#hexgrid)"/>
  <rect width="900" height="500" fill="url(#scanlines)"/>

  <!-- Top + Bottom borders -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="499" x2="900" y2="499" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="0" x2="0" y2="500" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="899" y1="0" x2="899" y2="500" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>

  <!-- ── Corner brackets ── -->
  <path d="M 8,8 L 8,30 M 8,8 L 30,8" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 892,8 L 892,30 M 892,8 L 870,8" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 8,492 L 8,470 M 8,492 L 30,492" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 892,492 L 892,470 M 892,492 L 870,492" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- ── Header ── -->
  <text x="450" y="34" font-family="'Courier New', monospace" font-size="11" fill="#4a4a8a" text-anchor="middle" letter-spacing="5">SYSTEM ARCHITECTURE  ◈  agent-toolkit</text>
  <line x1="50" y1="44" x2="850" y2="44" stroke="#0a1a3a" stroke-width="1"/>

  <!-- ── Vertical divider separating layers from tools ── -->
  <line x1="680" y1="55" x2="680" y2="445" stroke="#0a1a3a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ══════════════════════════════════════ -->
  <!-- ── L1 Layer ── -->
  <!-- ══════════════════════════════════════ -->
  <rect x="25" y="60" width="635" height="88" rx="3" fill="url(#l1-grad)" stroke="#1a2a4a" stroke-width="1.5"/>

  <!-- L1 corner brackets -->
  <path d="M 28,63 L 28,75 M 28,63 L 40,63" stroke="#0080ff" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 657,63 L 657,75 M 657,63 L 645,63" stroke="#0080ff" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 28,145 L 28,133 M 28,145 L 40,145" stroke="#0080ff" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 657,145 L 657,133 M 657,145 L 645,145" stroke="#0080ff" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- L1 badge -->
  <rect x="28" y="68" width="32" height="14" rx="2" fill="#0a1830" stroke="#1a3060" stroke-width="1"/>
  <text x="44" y="79" font-family="'Courier New', monospace" font-size="8" fill="#0080ff" text-anchor="middle" font-weight="bold">L1</text>

  <text x="68" y="79" font-family="'Courier New', monospace" font-size="10" fill="#4a5a7a" letter-spacing="3">:: WORKSTATION LAYER</text>

  <text x="42" y="104" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#2a4a7a">agentic-workstation</text>
  <text x="42" y="124" font-family="'Courier New', monospace" font-size="11" fill="#2a3a5a">chezmoi provisioning · dotfiles · workstation setup</text>
  <text x="42" y="140" font-family="'Courier New', monospace" font-size="9" fill="#1a2a4a" letter-spacing="2">PROVISIONS ENVIRONMENT</text>


  <!-- ══════════════════════════════════════ -->
  <!-- ── Arrow L1 → L1.5 ── -->
  <!-- ══════════════════════════════════════ -->
  <!-- Vertical connector -->
  <line x1="340" y1="148" x2="340" y2="178" stroke="#00ff88" stroke-width="2" opacity="0.8" filter="url(#glow-green)"/>
  <!-- Arrowhead -->
  <polygon points="334,175 340,188 346,175" fill="#00ff88" opacity="0.9" filter="url(#glow-green)"/>

  <!-- Label -->
  <rect x="350" y="155" width="75" height="14" rx="2" fill="#020f05" stroke="#003a1a" stroke-width="1"/>
  <text x="387" y="165" font-family="'Courier New', monospace" font-size="8" fill="#00ff88" text-anchor="middle" opacity="0.8">installs ↓</text>

  <!-- ══════════════════════════════════════ -->
  <!-- ── L1.5 Layer (GLOWING — THIS REPO) ── -->
  <!-- ══════════════════════════════════════ -->

  <!-- Ambient glow behind box -->
  <rect x="20" y="190" width="645" height="128" rx="6" fill="url(#l15-ambient)" filter="url(#box-ambient)"/>

  <!-- Outer glow border -->
  <rect x="22" y="192" width="641" height="124" rx="5" fill="none" stroke="#00ff88" stroke-width="3" opacity="0.6" filter="url(#box-glow)"/>

  <!-- Main box -->
  <rect x="25" y="196" width="635" height="116" rx="3" fill="url(#l15-grad)" stroke="#00ff88" stroke-width="2"/>

  <!-- Inner subtle fill -->
  <rect x="27" y="198" width="631" height="112" rx="2" fill="#00ff88" opacity="0.03"/>

  <!-- L1.5 corner brackets -->
  <path d="M 28,199 L 28,215 M 28,199 L 44,199" stroke="#00ff88" stroke-width="2" fill="none" filter="url(#glow-green)"/>
  <path d="M 657,199 L 657,215 M 657,199 L 641,199" stroke="#00ff88" stroke-width="2" fill="none" filter="url(#glow-green)"/>
  <path d="M 28,309 L 28,293 M 28,309 L 44,309" stroke="#00ff88" stroke-width="2" fill="none" filter="url(#glow-green)"/>
  <path d="M 657,309 L 657,293 M 657,309 L 641,309" stroke="#00ff88" stroke-width="2" fill="none" filter="url(#glow-green)"/>

  <!-- L1.5 badge -->
  <rect x="28" y="205" width="40" height="14" rx="2" fill="#003a20" stroke="#00ff88" stroke-width="1"/>
  <text x="48" y="216" font-family="'Courier New', monospace" font-size="8" fill="#00ff88" text-anchor="middle" font-weight="bold">L1.5</text>

  <text x="76" y="216" font-family="'Courier New', monospace" font-size="10" fill="#00aa66" letter-spacing="3" filter="url(#glow-green)">:: DISTRIBUTION LAYER</text>

  <!-- THIS REPO badge -->
  <rect x="415" y="204" width="100" height="16" rx="2" fill="#00ff88" opacity="0.15" stroke="#00ff88" stroke-width="1"/>
  <text x="465" y="215" font-family="'Courier New', monospace" font-size="9" fill="#00ff88" text-anchor="middle" font-weight="bold" filter="url(#glow-green)">◈  THIS REPO  ◈</text>

  <text x="42" y="241" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#00ff88" filter="url(#glow-green)">agent-toolkit</text>
  <text x="42" y="261" font-family="'Courier New', monospace" font-size="11" fill="#00aa66">uvx --from agent-toolkit-cli  ·  uv tool install  ·  brew / AUR</text>

  <!-- Component chips -->
  <rect x="42" y="272" width="68" height="22" rx="3" fill="#003a20" stroke="#00ff88" stroke-width="1"/>
  <text x="76" y="286" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" text-anchor="middle">[skills]</text>

  <rect x="118" y="272" width="68" height="22" rx="3" fill="#003a20" stroke="#00cc77" stroke-width="1"/>
  <text x="152" y="286" font-family="'Courier New', monospace" font-size="10" fill="#00cc77" text-anchor="middle">[agents]</text>

  <rect x="194" y="272" width="60" height="22" rx="3" fill="#002a28" stroke="#00d4ff" stroke-width="1"/>
  <text x="224" y="286" font-family="'Courier New', monospace" font-size="10" fill="#00d4ff" text-anchor="middle">[loops]</text>

  <rect x="262" y="272" width="72" height="22" rx="3" fill="#180a30" stroke="#9945ff" stroke-width="1"/>
  <text x="298" y="286" font-family="'Courier New', monospace" font-size="10" fill="#9945ff" text-anchor="middle">[profiles]</text>

  <rect x="342" y="272" width="50" height="22" rx="3" fill="#180818" stroke="#ff00aa" stroke-width="1"/>
  <text x="367" y="286" font-family="'Courier New', monospace" font-size="10" fill="#ff00aa" text-anchor="middle">[mcp]</text>

  <!-- Pulsing glow animation on L1.5 border -->
  <rect x="25" y="196" width="635" height="116" rx="3" fill="none" stroke="#00ff88" stroke-width="4" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- ══════════════════════════════════════ -->
  <!-- ── Arrow L1.5 → L3 ── -->
  <!-- ══════════════════════════════════════ -->
  <line x1="340" y1="312" x2="340" y2="342" stroke="#4a4a8a" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="334,340 340,352 346,340" fill="#4a4a8a" opacity="0.6"/>

  <rect x="350" y="320" width="80" height="14" rx="2" fill="#080818" stroke="#0a0a2a" stroke-width="1"/>
  <text x="390" y="330" font-family="'Courier New', monospace" font-size="8" fill="#4a4a8a" text-anchor="middle">consumed by ↓</text>

  <!-- ══════════════════════════════════════ -->
  <!-- ── L3 Layer ── -->
  <!-- ══════════════════════════════════════ -->
  <rect x="25" y="355" width="635" height="88" rx="3" fill="url(#l3-grad)" stroke="#1a2a4a" stroke-width="1.5"/>

  <!-- L3 corner brackets -->
  <path d="M 28,358 L 28,370 M 28,358 L 40,358" stroke="#4a4a8a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 657,358 L 657,370 M 657,358 L 645,358" stroke="#4a4a8a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 28,440 L 28,428 M 28,440 L 40,440" stroke="#4a4a8a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 657,440 L 657,428 M 657,440 L 645,440" stroke="#4a4a8a" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- L3 badge -->
  <rect x="28" y="363" width="32" height="14" rx="2" fill="#0a0820" stroke="#1a1040" stroke-width="1"/>
  <text x="44" y="374" font-family="'Courier New', monospace" font-size="8" fill="#4a4a8a" text-anchor="middle" font-weight="bold">L3</text>

  <text x="68" y="374" font-family="'Courier New', monospace" font-size="10" fill="#2a2a5a" letter-spacing="3">:: AI WORKSPACE RUNTIME</text>

  <text x="42" y="400" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#2a2a5a">agentic-harness</text>
  <text x="42" y="420" font-family="'Courier New', monospace" font-size="11" fill="#1a1a4a">memory · loops · personas · packs · multi-repo orchestration</text>
  <text x="42" y="436" font-family="'Courier New', monospace" font-size="9" fill="#1a1a3a" letter-spacing="2">CONSUMES DISTRIBUTION LAYER</text>

  <!-- ══════════════════════════════════════ -->
  <!-- ── Right Column: AI Tools ── -->
  <!-- ══════════════════════════════════════ -->

  <!-- Right column header -->
  <text x="790" y="70" font-family="'Courier New', monospace" font-size="9" fill="#4a4a8a" text-anchor="middle" letter-spacing="3">AI CLIENTS</text>

  <!-- Tool definitions: [y, label, color] -->
  <!-- CLAUDE CODE -->
  <rect x="700" y="78" width="185" height="28" rx="3" fill="#0a0520" stroke="#9945ff" stroke-width="1.5"/>
  <text x="714" y="89" font-family="'Courier New', monospace" font-size="7" fill="#9945ff">●</text>
  <text x="725" y="95" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#9945ff">CLAUDE CODE</text>
  <text x="826" y="95" font-family="'Courier New', monospace" font-size="8" fill="#4a4a8a"> / desktop</text>

  <!-- CURSOR -->
  <rect x="700" y="118" width="185" height="28" rx="3" fill="#030d18" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="714" y="129" font-family="'Courier New', monospace" font-size="7" fill="#00d4ff">●</text>
  <text x="725" y="135" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00d4ff">CURSOR</text>

  <!-- OPENCODE -->
  <rect x="700" y="158" width="185" height="28" rx="3" fill="#180a03" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="714" y="169" font-family="'Courier New', monospace" font-size="7" fill="#ff6b35">●</text>
  <text x="725" y="175" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ff6b35">OPENCODE</text>

  <!-- COPILOT -->
  <rect x="700" y="230" width="185" height="28" rx="3" fill="#031808" stroke="#00ff88" stroke-width="1.5"/>
  <text x="714" y="241" font-family="'Courier New', monospace" font-size="7" fill="#00ff88">●</text>
  <text x="725" y="247" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00ff88">COPILOT</text>

  <!-- WINDSURF -->
  <rect x="700" y="270" width="185" height="28" rx="3" fill="#020b1a" stroke="#0080ff" stroke-width="1.5"/>
  <text x="714" y="281" font-family="'Courier New', monospace" font-size="7" fill="#0080ff">●</text>
  <text x="725" y="287" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#0080ff">WINDSURF</text>

  <!-- PI AGENT -->
