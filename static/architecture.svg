  <text x="714" y="321" font-family="'Courier New', monospace" font-size="7" fill="#ff00aa">●</text>
  <text x="725" y="327" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ff00aa">PI AGENT</text>

  <!-- ── Connection lines from tools to L1.5 (the glowing box) ── -->
  <!-- Each line goes from right edge of tool card to left edge of L1.5 box (x=660) -->
  <!-- Target Y center of L1.5 = 196 + 58 = 254 -->

  <!-- CLAUDE → L1.5 -->
