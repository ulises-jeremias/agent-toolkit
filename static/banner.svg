<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="agent-toolkit banner">
  <defs>
    <pattern id="hexgrid" width="60" height="52" x="0" y="0" patternUnits="userSpaceOnUse">
      <polygon fill="none" stroke="#0a0a2a" stroke-width=".8" points="30 2 58 17 58 47 30 62 2 47 2 17" opacity=".6"/>
    </pattern>
    <pattern id="scanlines" width="1" height="4" x="0" y="0" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000008" opacity=".18"/>
    </pattern>
    <filter id="glow-green" width="200%" height="200%" x="-50%" y="-50%">
      <feGaussianBlur result="b1" stdDeviation="6"/><feGaussianBlur result="b2" stdDeviation="12"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" width="200%" height="200%" x="-50%" y="-50%">
      <feGaussianBlur result="b1" stdDeviation="8"/><feGaussianBlur result="b2" stdDeviation="16"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" width="200%" height="200%" x="-50%" y="-50%">
      <feGaussianBlur result="b1" stdDeviation="5"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="title-gradient" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="50%" stop-color="#0f8"/><stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <radialGradient id="title-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity=".12"/><stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="at-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f8" stop-opacity=".25"/><stop offset="100%" stop-color="#0f8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="at-gradient" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0f8"/><stop offset="100%" stop-color="#0a5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="#050510"/>
  <rect width="1200" height="340" fill="url(#hexgrid)"/>
  <rect width="1200" height="340" fill="url(#scanlines)"/>
  <line x1="0" x2="1200" y1="0" y2="0" stroke="#0f8" stroke-width="2" filter="url(#glow-green)" opacity=".8"/>
  <line x1="0" x2="1200" y1="339" y2="339" stroke="#00d4ff" stroke-width="1.5" opacity=".6"/>
  <line x1="0" x2="0" y1="0" y2="340" stroke="#0f8" stroke-width="2" opacity=".9"/>
  <line x1="1199" x2="1199" y1="0" y2="340" stroke="#00d4ff" stroke-width="1.5" opacity=".6"/>
  <line x1="276" x2="276" y1="20" y2="320" stroke="#0a1a3a" stroke-width="1" opacity=".8"/>

  <!-- corner brackets -->
  <path fill="none" stroke="#00d4ff" stroke-width="2" d="M 8,8 L 8,38 M 8,8 L 38,8" opacity=".9"/>
  <path fill="none" stroke="#00d4ff" stroke-width="2" d="M 1192,8 L 1192,38 M 1192,8 L 1162,8" opacity=".9"/>
  <path fill="none" stroke="#00d4ff" stroke-width="2" d="M 8,332 L 8,302 M 8,332 L 38,332" opacity=".9"/>
  <path fill="none" stroke="#00d4ff" stroke-width="2" d="M 1192,332 L 1192,302 M 1192,332 L 1162,332" opacity=".9"/>

  <!-- left panel: logo -->
  <ellipse cx="138" cy="150" fill="url(#at-glow)" rx="100" ry="100"/>
  <polygon fill="none" stroke="#0f8" stroke-width="2" points="138 45 198 78 198 145 138 178 78 145 78 78" filter="url(#glow-green)" opacity=".7"/>
  <polygon fill="none" stroke="#0f8" stroke-width="1" points="138 52 191 83 191 140 138 171 85 140 85 83" opacity=".3"/>
  <path fill="none" stroke="url(#at-gradient)" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M 108,160 L 138,85 L 168,160 M 118,138 L 158,138" filter="url(#glow-green)"/>
  <text x="138" y="202" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10" letter-spacing="4" text-anchor="middle">AGENT · TOOLKIT</text>
  <rect width="92" height="16" x="92" y="210" fill="#0a1428" stroke="#0a2a4a" stroke-width="1" rx="2"/>
  <text x="138" y="221" fill="#00d4ff" font-family="'Courier New', monospace" font-size="9" opacity=".7" text-anchor="middle">latest</text>
  <text x="138" y="252" fill="#0f8" font-family="'Courier New', monospace" font-size="9" opacity=".8" text-anchor="middle">◉ v-first binary</text>
  <text x="138" y="268" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">single source of truth</text>

  <!-- center: title -->
  <ellipse cx="530" cy="145" fill="url(#title-glow)" rx="265" ry="80"/>
  <text x="295" y="106" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="11" letter-spacing="3">$ agent-toolkit</text>
  <text x="412" y="106" fill="#0f8" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" opacity=".8">swarm start --recipe pair</text>
  <text x="530" y="173" fill="url(#title-gradient)" filter="url(#glow-cyan)" font-family="'Courier New', monospace" font-size="64" font-weight="bold" letter-spacing="-1" text-anchor="middle">agent-toolkit</text>
  <text x="530" y="205" fill="#9945ff" filter="url(#glow-purple)" font-family="'Courier New', monospace" font-size="13" letter-spacing="5" text-anchor="middle">◈ COMPOSABLE AI AGENT CAPABILITIES ◈</text>
  <!-- declarative counts: floors only, never stale exact numbers -->
  <text x="530" y="233" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" text-anchor="middle">116+ skills · 18 agents · 10 loops · 7 packs · 7 mcp</text>
  <text x="530" y="251" fill="#0f8" font-family="'Courier New', monospace" font-size="10" letter-spacing="1" opacity=".85" text-anchor="middle">new: swarm orchestration (pair / team / full)</text>

  <!-- right: platforms -->
  <text x="966" y="52" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="9" letter-spacing="3" text-anchor="middle">DEPLOY TO 7 CODING ASSISTANTS</text>
  <rect width="112" height="34" x="810" y="62" fill="#0a0520" stroke="#9945ff" stroke-width="1.5" rx="3"/>
  <text x="816" y="74" fill="#9945ff" font-family="'Courier New', monospace" font-size="7" opacity=".7">●</text>
  <text x="866" y="77" fill="#9945ff" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">CLAUDE</text>
  <text x="866" y="89" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="7" text-anchor="middle">code + desktop</text>
  <rect width="112" height="34" x="932" y="62" fill="#030d18" stroke="#00d4ff" stroke-width="1.5" rx="3"/>
  <text x="938" y="74" fill="#00d4ff" font-family="'Courier New', monospace" font-size="7" opacity=".7">●</text>
  <text x="988" y="77" fill="#00d4ff" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">CURSOR</text>
  <text x="988" y="89" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="7" text-anchor="middle">rules + plugins</text>
  <rect width="112" height="34" x="1054" y="62" fill="#180a03" stroke="#ff6b35" stroke-width="1.5" rx="3"/>
  <text x="1060" y="74" fill="#ff6b35" font-family="'Courier New', monospace" font-size="7" opacity=".7">●</text>
  <text x="1110" y="77" fill="#ff6b35" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">OPENCODE</text>
  <text x="1110" y="89" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="7" text-anchor="middle">agents + skills</text>
  <rect width="112" height="34" x="810" y="106" fill="#031808" stroke="#0f8" stroke-width="1.5" rx="3"/>
  <text x="816" y="118" fill="#0f8" font-family="'Courier New', monospace" font-size="7" opacity=".7">●</text>
  <text x="866" y="121" fill="#0f8" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">COPILOT</text>
  <text x="866" y="133" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="7" text-anchor="middle">instructions</text>
  <rect width="112" height="34" x="932" y="106" fill="#020b1a" stroke="#0080ff" stroke-width="1.5" rx="3"/>
  <text x="938" y="118" fill="#0080ff" font-family="'Courier New', monospace" font-size="7" opacity=".7">●</text>
  <text x="988" y="121" fill="#0080ff" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">WINDSURF</text>
  <text x="988" y="133" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="7" text-anchor="middle">rules + cascade</text>
  <rect width="112" height="34" x="1054" y="106" fill="#180318" stroke="#f0a" stroke-width="1.5" rx="3"/>
  <text x="1060" y="118" fill="#f0a" font-family="'Courier New', monospace" font-size="7" opacity=".7">●</text>
  <text x="1110" y="121" fill="#f0a" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">PI AGENT</text>
  <text x="1110" y="133" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="7" text-anchor="middle">native skills</text>
  <rect width="356" height="34" x="810" y="150" fill="#1a1403" stroke="#eab308" stroke-width="1.5" rx="3"/>
  <text x="816" y="162" fill="#eab308" font-family="'Courier New', monospace" font-size="7" opacity=".7">●</text>
  <text x="988" y="165" fill="#eab308" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">MUSE CODE</text>
  <text x="988" y="177" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="7" text-anchor="middle">CLI + Agent Skills</text>

  <!-- bottom status bar -->
  <rect width="1160" height="28" x="20" y="288" fill="#03060f" stroke="#0a1428" stroke-width="1" rx="3"/>
  <text x="32" y="306" fill="#0f8" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">■ OPERATIONAL</text>
  <text x="150" y="306" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10">│</text>
  <text x="162" y="306" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">CHANNELS:</text>
  <text x="240" y="306" fill="#00d4ff" font-family="'Courier New', monospace" font-size="10">npm · pypi · aur · brew · ghcr · binary</text>
  <text x="530" y="306" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10">│</text>
  <text x="545" y="306" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">BACKENDS:</text>
  <text x="630" y="306" fill="#9945ff" font-family="'Courier New', monospace" font-size="10">herdr · tmux · headless</text>
  <text x="830" y="306" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10">│</text>
  <text x="845" y="306" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10">live counts: agent-toolkit inventory</text>
  <text x="1130" y="306" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="9" text-anchor="end">MIT</text>
  <text x="1168" y="306" fill="#0f8" font-family="'Courier New', monospace" font-size="9">◉</text>

  <!-- pulse -->
  <polygon fill="none" stroke="#0f8" stroke-width="3" points="138 45 198 78 198 145 138 178 78 145 78 78" opacity="0">
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0.4;0"/>
    <animate attributeName="stroke-width" dur="3s" repeatCount="indefinite" values="3;8;3"/>
  </polygon>
</svg>
