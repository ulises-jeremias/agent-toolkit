<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <!-- Hex grid pattern -->
    <pattern id="hexgrid" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,2 58,17 58,47 30,62 2,47 2,17" fill="none" stroke="#0a0a2a" stroke-width="0.8" opacity="0.6"/>
    </pattern>

    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000008" opacity="0.18"/>
    </pattern>

    <!-- Neon green glow filter -->
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyan glow filter -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Purple glow filter -->
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft ambient glow -->
    <filter id="ambient-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient: main title cyan -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <!-- Gradient: progress bar -->
    <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <!-- Gradient: AT monogram -->
    <linearGradient id="at-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00aa55"/>
    </linearGradient>

    <!-- Radial glow behind AT -->
    <radialGradient id="at-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <!-- Radial glow behind title -->
    <radialGradient id="title-glow-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradient: left panel -->
    <linearGradient id="left-panel-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050518"/>
      <stop offset="100%" stop-color="#08082a"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="340" fill="#050510"/>
  <rect width="1200" height="340" fill="url(#hexgrid)"/>
  <rect width="1200" height="340" fill="url(#scanlines)"/>

  <!-- Left panel accent -->
  <rect x="0" y="0" width="280" height="340" fill="url(#left-panel-grad)" opacity="0.5"/>

  <!-- Top border line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#00ff88" stroke-width="2" opacity="0.8" filter="url(#glow-green)"/>

  <!-- Bottom border line -->
  <line x1="0" y1="339" x2="1200" y2="339" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>

  <!-- Left vertical accent -->
  <line x1="0" y1="0" x2="0" y2="340" stroke="#00ff88" stroke-width="2" opacity="0.9"/>

  <!-- Right vertical accent -->
  <line x1="1199" y1="0" x2="1199" y2="340" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>

  <!-- Vertical divider left panel -->
  <line x1="276" y1="20" x2="276" y2="320" stroke="#0a1a3a" stroke-width="1" opacity="0.8"/>

  <!-- ── Tactical corner brackets ── -->
  <!-- Top-left -->
  <path d="M 8,8 L 8,38 M 8,8 L 38,8" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.9"/>
  <!-- Top-right -->
  <path d="M 1192,8 L 1192,38 M 1192,8 L 1162,8" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.9"/>
  <!-- Bottom-left -->
  <path d="M 8,332 L 8,302 M 8,332 L 38,332" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.9"/>
  <!-- Bottom-right -->
  <path d="M 1192,332 L 1192,302 M 1192,332 L 1162,332" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.9"/>

  <!-- ── AT Monogram (left) ── -->
  <!-- Glow behind AT -->
  <ellipse cx="138" cy="160" rx="100" ry="100" fill="url(#at-glow)"/>

  <!-- AT hexagon frame -->
  <polygon points="138,55 198,88 198,155 138,188 78,155 78,88" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.7" filter="url(#glow-green)"/>
  <polygon points="138,62 191,93 191,150 138,181 85,150 85,93" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.3"/>

  <!-- "A" glyph -->
  <path d="M 108,170 L 138,95 L 168,170 M 118,148 L 158,148" stroke="url(#at-gradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow-green)"/>

  <!-- "T" small subscript -->
  <text x="160" y="180" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#00ff88" opacity="0.85" filter="url(#glow-green)">T</text>

  <!-- AT label below -->
  <text x="138" y="210" font-family="'Courier New', monospace" font-size="10" fill="#4a4a8a" text-anchor="middle" letter-spacing="4">AGENT · TOOLKIT</text>

  <!-- Version tag -->
  <rect x="98" y="218" width="80" height="16" rx="2" fill="#0a1428" stroke="#0a2a4a" stroke-width="1"/>
  <text x="138" y="229" font-family="'Courier New', monospace" font-size="9" fill="#00d4ff" text-anchor="middle" opacity="0.7">v0.1.0-alpha</text>

  <!-- ── Center: Main Title ── -->
  <!-- Title glow background -->
  <ellipse cx="530" cy="145" rx="265" ry="80" fill="url(#title-glow-bg)"/>

  <!-- Prefix -->
  <text x="295" y="108" font-family="'Courier New', monospace" font-size="11" fill="#4a4a8a" letter-spacing="3">~/toolkit $</text>
  <text x="385" y="108" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" opacity="0.8" letter-spacing="1">run --mode=production</text>

  <!-- Main title -->
  <text x="530" y="175" font-family="'Courier New', monospace" font-size="64" font-weight="bold" fill="url(#title-gradient)" text-anchor="middle" letter-spacing="-1" filter="url(#glow-cyan)">agent-toolkit</text>

  <!-- Subtitle -->
  <text x="530" y="207" font-family="'Courier New', monospace" font-size="13" fill="#9945ff" text-anchor="middle" letter-spacing="5" filter="url(#glow-purple)">◈  COMPOSABLE AI AGENT CAPABILITIES  ◈</text>

  <!-- Tagline -->
  <text x="530" y="235" font-family="'Courier New', monospace" font-size="11" fill="#4a4a8a" text-anchor="middle" letter-spacing="2">skills · agents · loops · profiles · mcp</text>

  <!-- Decorative horizontal rule -->
  <line x1="295" y1="243" x2="400" y2="243" stroke="#0a2a4a" stroke-width="1"/>
  <line x1="411" y1="243" x2="649" y2="243" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="705" y1="243" x2="810" y2="243" stroke="#0a2a4a" stroke-width="1"/>

  <!-- ── Right side: Tool cards ── -->
  <!-- Section header -->
  <text x="868" y="68" font-family="'Courier New', monospace" font-size="9" fill="#4a4a8a" text-anchor="middle" letter-spacing="3">SUPPORTED PLATFORMS</text>

  <!-- Row 1 -->
  <!-- CLAUDE -->
  <rect x="810" y="76" width="112" height="34" rx="3" fill="#0a0520" stroke="#9945ff" stroke-width="1.5"/>
  <text x="816" y="88" font-family="'Courier New', monospace" font-size="7" fill="#9945ff" opacity="0.7">●</text>
  <text x="866" y="91" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#9945ff" text-anchor="middle">CLAUDE</text>
  <text x="866" y="103" font-family="'Courier New', monospace" font-size="7" fill="#4a4a8a" text-anchor="middle">code + desktop</text>

  <!-- CURSOR -->
  <rect x="932" y="76" width="112" height="34" rx="3" fill="#030d18" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="938" y="88" font-family="'Courier New', monospace" font-size="7" fill="#00d4ff" opacity="0.7">●</text>
  <text x="988" y="91" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00d4ff" text-anchor="middle">CURSOR</text>
  <text x="988" y="103" font-family="'Courier New', monospace" font-size="7" fill="#4a4a8a" text-anchor="middle">rules + agents</text>

  <!-- OPENCODE -->
  <rect x="1054" y="76" width="112" height="34" rx="3" fill="#180a03" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="1060" y="88" font-family="'Courier New', monospace" font-size="7" fill="#ff6b35" opacity="0.7">●</text>
  <text x="1110" y="91" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ff6b35" text-anchor="middle">OPENCODE</text>
  <text x="1110" y="103" font-family="'Courier New', monospace" font-size="7" fill="#4a4a8a" text-anchor="middle">agents + skills</text>

  <!-- Row 2 -->
  <!-- COPILOT -->
  <rect x="810" y="120" width="112" height="34" rx="3" fill="#031808" stroke="#00ff88" stroke-width="1.5"/>
  <text x="816" y="132" font-family="'Courier New', monospace" font-size="7" fill="#00ff88" opacity="0.7">●</text>
  <text x="866" y="135" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00ff88" text-anchor="middle">COPILOT</text>
  <text x="866" y="147" font-family="'Courier New', monospace" font-size="7" fill="#4a4a8a" text-anchor="middle">instructions</text>

  <!-- WINDSURF -->
  <rect x="932" y="120" width="112" height="34" rx="3" fill="#020b1a" stroke="#0080ff" stroke-width="1.5"/>
  <text x="938" y="132" font-family="'Courier New', monospace" font-size="7" fill="#0080ff" opacity="0.7">●</text>
  <text x="988" y="135" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#0080ff" text-anchor="middle">WINDSURF</text>
  <text x="988" y="147" font-family="'Courier New', monospace" font-size="7" fill="#4a4a8a" text-anchor="middle">rules + cascade</text>

  <!-- PI -->
  <rect x="1054" y="120" width="112" height="34" rx="3" fill="#180318" stroke="#ff00aa" stroke-width="1.5"/>
  <text x="1060" y="132" font-family="'Courier New', monospace" font-size="7" fill="#ff00aa" opacity="0.7">●</text>
  <text x="1110" y="135" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ff00aa" text-anchor="middle">PI AGENT</text>
  <text x="1110" y="147" font-family="'Courier New', monospace" font-size="7" fill="#4a4a8a" text-anchor="middle">skills + loops</text>

  <!-- Stats row -->
  <rect x="810" y="164" width="356" height="26" rx="2" fill="#03060f" stroke="#0a1a3a" stroke-width="1"/>
  <text x="820" y="180" font-family="'Courier New', monospace" font-size="9" fill="#4a4a8a">STATUS:</text>
  <text x="862" y="180" font-family="'Courier New', monospace" font-size="9" fill="#00ff88">ALL PLATFORMS NOMINAL</text>
  <text x="1030" y="180" font-family="'Courier New', monospace" font-size="9" fill="#4a4a8a">│ 6/6</text>
  <text x="1060" y="180" font-family="'Courier New', monospace" font-size="9" fill="#00ff88">ACTIVE</text>

  <!-- ── Bottom bar: OPERATIONAL status ── -->
  <rect x="20" y="265" width="1160" height="28" rx="3" fill="#03060f" stroke="#0a1428" stroke-width="1"/>

  <!-- Progress fill -->
  <rect x="22" y="267" width="870" height="24" rx="2" fill="url(#progress-gradient)" opacity="0.15"/>
  <rect x="22" y="267" width="870" height="24" rx="2" fill="#00ff88" opacity="0.08"/>

  <!-- Progress segments -->
  <rect x="24" y="269" width="8" height="20" rx="1" fill="#00ff88" opacity="0.9"/>
  <rect x="36" y="269" width="8" height="20" rx="1" fill="#00ff88" opacity="0.85"/>
  <rect x="48" y="269" width="8" height="20" rx="1" fill="#00ff88" opacity="0.8"/>
  <rect x="60" y="269" width="8" height="20" rx="1" fill="#00ff88" opacity="0.75"/>
  <rect x="72" y="269" width="8" height="20" rx="1" fill="#00ff88" opacity="0.7"/>
  <rect x="84" y="269" width="8" height="20" rx="1" fill="#00ff88" opacity="0.65"/>
  <rect x="96" y="269" width="8" height="20" rx="1" fill="#00d4ff" opacity="0.6"/>
  <rect x="108" y="269" width="8" height="20" rx="1" fill="#00d4ff" opacity="0.55"/>

  <text x="130" y="282" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" letter-spacing="1">■ OPERATIONAL</text>
  <text x="258" y="282" font-family="'Courier New', monospace" font-size="10" fill="#4a4a8a">│</text>
  <text x="268" y="282" font-family="'Courier New', monospace" font-size="10" fill="#4a4a8a" letter-spacing="1">SKILLS: </text>
  <text x="328" y="282" font-family="'Courier New', monospace" font-size="10" fill="#00d4ff">LOADED</text>
  <text x="390" y="282" font-family="'Courier New', monospace" font-size="10" fill="#4a4a8a">│</text>
  <text x="400" y="282" font-family="'Courier New', monospace" font-size="10" fill="#4a4a8a">AGENTS: </text>
  <text x="460" y="282" font-family="'Courier New', monospace" font-size="10" fill="#00d4ff">LOADED</text>
  <text x="522" y="282" font-family="'Courier New', monospace" font-size="10" fill="#4a4a8a">│</text>
  <text x="532" y="282" font-family="'Courier New', monospace" font-size="10" fill="#4a4a8a">LOOPS: </text>
  <text x="584" y="282" font-family="'Courier New', monospace" font-size="10" fill="#00d4ff">ARMED</text>
  <text x="636" y="282" font-family="'Courier New', monospace" font-size="10" fill="#4a4a8a">│</text>
  <text x="646" y="282" font-family="'Courier New', monospace" font-size="10" fill="#4a4a8a">MCP: </text>
  <text x="686" y="282" font-family="'Courier New', monospace" font-size="10" fill="#00d4ff">ACTIVE</text>

  <text x="1050" y="282" font-family="'Courier New', monospace" font-size="9" fill="#4a4a8a">MIT LICENSE</text>
  <text x="1130" y="282" font-family="'Courier New', monospace" font-size="9" fill="#4a4a8a" text-anchor="end">2026</text>
  <text x="1168" y="282" font-family="'Courier New', monospace" font-size="9" fill="#00ff88">◉</text>

  <!-- ── Blinking cursor animation ── -->
  <rect x="830" y="212" width="8" height="16" rx="1" fill="#00ff88" opacity="0.9" filter="url(#glow-green)">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="820" y="225" font-family="'Courier New', monospace" font-size="10" fill="#4a4a8a">sys:~$</text>
  <text x="842" y="225" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" opacity="0.6">_</text>

  <!-- Pulsing glow on AT hex -->
  <polygon points="138,55 198,88 198,155 138,188 78,155 78,88" fill="none" stroke="#00ff88" stroke-width="3" opacity="0.0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;8;3" dur="3s" repeatCount="indefinite"/>
  </polygon>

</svg>
