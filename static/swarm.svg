<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="agent-toolkit swarm orchestration">
  <defs>
    <pattern id="hexgrid2" width="60" height="52" x="0" y="0" patternUnits="userSpaceOnUse">
      <polygon fill="none" stroke="#0a0a2a" stroke-width=".8" points="30 2 58 17 58 47 30 62 2 47 2 17" opacity=".5"/>
    </pattern>
    <filter id="g-green" width="200%" height="200%" x="-50%" y="-50%">
      <feGaussianBlur result="b" stdDeviation="4"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g-purple" width="200%" height="200%" x="-50%" y="-50%">
      <feGaussianBlur result="b" stdDeviation="5"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f8"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#050510"/>
  <rect width="960" height="420" fill="url(#hexgrid2)"/>
  <line x1="0" x2="960" y1="0" y2="0" stroke="#0f8" stroke-width="2" filter="url(#g-green)" opacity=".7"/>

  <text x="480" y="42" fill="#0f8" font-family="'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" filter="url(#g-green)">agent-toolkit swarm</text>
  <text x="480" y="64" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" text-anchor="middle">multi-agent runs with filesystem state · handoffs · budgets · observability</text>

  <!-- task input -->
  <rect x="40" y="92" width="230" height="64" rx="8" fill="#031808" stroke="#0f8" stroke-width="1.5"/>
  <text x="155" y="116" fill="#0f8" font-family="'Courier New', monospace" font-size="12" font-weight="bold" text-anchor="middle">YOUR TASK</text>
  <text x="155" y="136" fill="#8f8fbf" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">issue / request / prompt</text>

  <!-- recipes -->
  <rect x="330" y="92" width="260" height="64" rx="8" fill="#0a0520" stroke="#9945ff" stroke-width="1.5" filter="url(#g-purple)"/>
  <text x="460" y="112" fill="#9945ff" font-family="'Courier New', monospace" font-size="12" font-weight="bold" text-anchor="middle">RECIPES</text>
  <text x="460" y="130" fill="#c8c8e8" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">pair · team · full</text>
  <text x="460" y="147" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">personas + policy per recipe</text>
  <line x1="270" y1="124" x2="328" y2="124" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- backends -->
  <rect x="650" y="92" width="270" height="64" rx="8" fill="#030d18" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="785" y="112" fill="#00d4ff" font-family="'Courier New', monospace" font-size="12" font-weight="bold" text-anchor="middle">BACKENDS</text>
  <text x="785" y="130" fill="#c8c8e8" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">herdr · tmux · headless</text>
  <text x="785" y="147" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">eager windows · blocking attach</text>
  <line x1="590" y1="124" x2="648" y2="124" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- writers row -->
  <text x="480" y="196" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" text-anchor="middle">GIT WORKTREE PER WRITER — ISOLATED BRANCHES</text>

  <rect x="60" y="212" width="250" height="70" rx="8" fill="#0a0f22" stroke="#0f8" stroke-width="1"/>
  <text x="185" y="234" fill="#0f8" font-family="'Courier New', monospace" font-size="12" font-weight="bold" text-anchor="middle">implementer</text>
  <text x="185" y="252" fill="#8f8fbf" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">worktree/feature-a</text>
  <text x="185" y="268" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">commits + handoff →</text>

  <rect x="355" y="212" width="250" height="70" rx="8" fill="#0a0f22" stroke="#0f8" stroke-width="1"/>
  <text x="480" y="234" fill="#0f8" font-family="'Courier New', monospace" font-size="12" font-weight="bold" text-anchor="middle">reviewer / qa</text>
  <text x="480" y="252" fill="#8f8fbf" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">review handoffs</text>
  <text x="480" y="268" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">approve / reject gates</text>

  <rect x="650" y="212" width="250" height="70" rx="8" fill="#0a0f22" stroke="#eab308" stroke-width="1"/>
  <text x="775" y="234" fill="#eab308" font-family="'Courier New', monospace" font-size="12" font-weight="bold" text-anchor="middle">integrator</text>
  <text x="775" y="252" fill="#8f8fbf" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">swarm promote</text>
  <text x="775" y="268" fill="#4a4a8a" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">merge → cleanup_pending</text>

  <line x1="310" y1="247" x2="353" y2="247" stroke="#0f8" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <line x1="605" y1="247" x2="648" y2="247" stroke="#0f8" stroke-width="1.5" marker-end="url(#arrow-g)"/>

  <!-- state strip -->
  <rect x="60" y="312" width="840" height="74" rx="8" fill="#03060f" stroke="#0a1a3a" stroke-width="1"/>
  <text x="80" y="336" fill="#00d4ff" font-family="'Courier New', monospace" font-size="11" font-weight="bold">.agent-toolkit/swarm/runs/&lt;id&gt;/</text>
  <text x="80" y="356" fill="#8f8fbf" font-family="'Courier New', monospace" font-size="10">state.json (atomic) · budget 900k tok / $4.00 / 7200s · trace.jsonl · approvals</text>
  <text x="80" y="374" fill="#0f8" font-family="'Courier New', monospace" font-size="10">lifecycle: planning → running → handoff → integrating → cleanup   ·   watch · report · logs · prune</text>
  <text x="880" y="336" fill="#9945ff" font-family="'Courier New', monospace" font-size="10" text-anchor="end">filesystem SoT</text>
</svg>
