  <text x="466" y="134" font-family="'Courier New', monospace" font-size="7.5" fill="#66ffaa">.md</text>
  <text x="466" y="148" font-family="'Courier New', monospace" font-size="7" fill="#4a4a8a">→ .github/</text>

  <line x1="468" y1="164" x2="590" y2="164" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>
