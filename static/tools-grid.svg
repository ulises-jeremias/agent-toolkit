  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- CARD 5: WINDSURF — blue (#0080ff) — x=608 -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="608" y="8" width="140" height="184" rx="4" fill="url(#card-blue)" stroke="#0080ff" stroke-width="2"/>
