<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <!-- Dot grid pattern -->
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#0a0a2a" opacity="0.6"/>
    </pattern>

    <!-- Scanlines -->
    <pattern id="scanlines" x="0" y="0" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000008" opacity="0.12"/>
    </pattern>

    <!-- Glow filters per tool color -->
    <filter id="glow-purple" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glow-cyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glow-orange" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glow-green" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glow-blue" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glow-magenta" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="text-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Card gradients -->
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#110525"/>
      <stop offset="100%" stop-color="#080215"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030e1e"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="card-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0803"/>
      <stop offset="100%" stop-color="#0e0402"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#031a0a"/>
      <stop offset="100%" stop-color="#020e05"/>
    </linearGradient>
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020a1c"/>
      <stop offset="100%" stop-color="#01060f"/>
    </linearGradient>
    <linearGradient id="card-magenta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18021a"/>
      <stop offset="100%" stop-color="#0c020e"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="900" height="200" fill="#050510"/>
  <rect width="900" height="200" fill="url(#dotgrid)"/>
  <rect width="900" height="200" fill="url(#scanlines)"/>

  <!-- Top/bottom accent lines -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#0a0a2a" stroke-width="1.5" opacity="0.8"/>
  <line x1="0" y1="199" x2="900" y2="199" stroke="#0a0a2a" stroke-width="1.5" opacity="0.8"/>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- CARD 1: CLAUDE — purple (#9945ff) — x=8 -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="8" y="8" width="140" height="184" rx="4" fill="url(#card-purple)" stroke="#9945ff" stroke-width="2"/>
  <!-- Top glow bar -->
  <rect x="8" y="8" width="140" height="4" rx="2" fill="#9945ff" opacity="0.7" filter="url(#glow-purple)"/>
  <!-- Inner top accent line -->
  <line x1="10" y1="30" x2="146" y2="30" stroke="#9945ff" stroke-width="0.5" opacity="0.3"/>

  <!-- Tool name -->
  <text x="78" y="50" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#9945ff" text-anchor="middle" filter="url(#text-glow)">CLAUDE</text>
  <text x="78" y="63" font-family="'Courier New', monospace" font-size="8" fill="#4a3a6a" text-anchor="middle" letter-spacing="2">CODE + DESKTOP</text>

