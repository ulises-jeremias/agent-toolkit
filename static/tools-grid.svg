    <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- Install snippet box -->
  <rect x="12" y="96" width="132" height="60" rx="2" fill="#070215" stroke="#2a1a4a" stroke-width="1"/>
  <text x="16" y="108" font-family="'Courier New', monospace" font-size="7" fill="#4a4a8a">$ install</text>
  <text x="16" y="122" font-family="'Courier New', monospace" font-size="7.5" fill="#9945ff">/plugin install</text>
  <text x="16" y="134" font-family="'Courier New', monospace" font-size="7.5" fill="#cc88ff">agent-toolkit</text>
  <text x="16" y="148" font-family="'Courier New', monospace" font-size="7.5" fill="#cc88ff">-core</text>

  <!-- Bottom stats -->
  <line x1="18" y1="164" x2="140" y2="164" stroke="#9945ff" stroke-width="0.5" opacity="0.2"/>
  <text x="22" y="176" font-family="'Courier New', monospace" font-size="8" fill="#4a3a6a">SKILLS  AGENTS  LOOPS</text>
  <text x="22" y="188" font-family="'Courier New', monospace" font-size="8" fill="#9945ff">✓       ✓       ✓</text>

