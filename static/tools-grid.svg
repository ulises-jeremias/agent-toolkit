  <text x="528" y="50" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00ff88" text-anchor="middle" filter="url(#text-glow)">COPILOT</text>
  <text x="528" y="63" font-family="'Courier New', monospace" font-size="8" fill="#003a1a" text-anchor="middle" letter-spacing="2">GITHUB + VS CODE</text>

  <line x1="468" y1="74" x2="590" y2="74" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>
  <text x="472" y="88" font-family="'Courier New', monospace" font-size="9" fill="#00ff88" filter="url(#text-glow)">● SUPPORTED
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="1.0s" repeatCount="indefinite"/>
  </text>

  <rect x="462" y="96" width="132" height="60" rx="2" fill="#020e05" stroke="#003a1a" stroke-width="1"/>
  <text x="466" y="108" font-family="'Courier New', monospace" font-size="7" fill="#4a4a8a">$ install</text>
