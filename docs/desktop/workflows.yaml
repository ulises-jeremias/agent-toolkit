# Desktop workflow ledger (Electron + React, ADR-033)
# Declarative companion to WORKFLOW_COVERAGE.md: each journey lists the
# discover → configure/execute → observe → recover state with an honest
# status. A journey is "ok" only with linked reviewed evidence at a recorded
# build SHA; everything else stays a blocker. Generic command/argument
# dialogs and manual declaration file edits never qualify as a journey.
spec: agent-toolkit/desktop-workflows@1
status: current-contract
scope: |
  Electron + React shipping Desktop. The native-V workflow matrix in
  WORKFLOW_COVERAGE.md is historical (ADR-032 retirement, ADR-033); this YAML
  is the current per-journey ledger for the Electron app.
journeys:
  - id: first-run-onboarding
    title: First run to a created or reused workspace
    destinations: [onboarding]
    status: ok
    evidence:
      - note: copied Linux package launched outside the checkout with fresh
          HOME/XDG and minimal PATH, workspace created entirely through the GUI
        build: "1.40.0 @ feat/cozy-pixel-world cb7394b2 (2026-09-30)"
      - note: >-
          First-run E2E covers an existing workspace, explicit creation of a
          missing workspace, and a crashed supervised backend restarted inside
          onboarding before continuing; the package smoke launches from fresh
          HOME/XDG. Compact and large failed-state captures were opened.
        build: "adda39ed (#1472; packaged Electron acceptance and Linux E2E)"
        tests:
          - apps/desktop/e2e/electron/onboarding.spec.ts
        screenshots:
          - assets/electron/onboarding/recovery-backend-failed-compact.png
          - assets/electron/onboarding/recovery-backend-failed-large.png
    blockers: []
    recovery: restart a failed local backend from onboarding; existing workspaces remain unchanged
  - id: workspace-switch-inspect
    title: Switch workspace and read its truth in the World
    destinations: [world, workspace]
    status: ok
    evidence:
      - note: >-
          The player-follow camera now selects a crisp exploration zoom by
          window width (32 px below 1280, 48 px through 1599, 64 px at 1600+),
          updates that default on resize, and preserves a user-selected zoom.
          Walk recenters on the player; Fit world remains an explicit overview.
          Electron E2E checks compact/large/intermediate resizing, manual zoom
          preservation, movement focus, and command-palette typing. Meadow and
          Dusk captures at 1024x640 and 1920x1080 were opened and reviewed with
          the installed 1.44.0 backend in a fresh temporary workspace.
        build: "feat/world-adaptive-camera (Linux Electron; renderer build; installed backend 1.44.0)"
        tests:
          - apps/desktop/e2e/electron/world-walk.spec.ts
          - apps/desktop/src/features/world/WorldEntityMap.test.tsx
          - apps/desktop/src/features/world/camera.test.ts
        screenshots:
          - assets/electron/world-adaptive-camera-2026-10-13/world-meadow-compact.png
          - assets/electron/world-adaptive-camera-2026-10-13/world-meadow-large.png
          - assets/electron/world-adaptive-camera-2026-10-13/world-dusk-compact.png
          - assets/electron/world-adaptive-camera-2026-10-13/world-dusk-large.png
      - note: >-
          Electron E2E changes to a second workspace through Settings, verifies
          the URL scope changes with the supervised harness, links a real
          project using the GUI, verifies its building in World, rejects a
          missing destination without changing the active workspace, switches
          back, and verifies that the original workspace remains empty. Project
          roster views revalidate on mount so an external CLI change does not
          remain hidden behind a fresh cache. Compact and large captures were
          opened.
        build: "206e4c6f9bb2177339c1c4fd866bed2a7ae1bdf6 (Linux Electron E2E; temporary HOME)"
        tests:
          - apps/desktop/e2e/electron/workspace-switch.spec.ts
          - apps/desktop/e2e/electron/people-session.spec.ts
        screenshots:
          - assets/electron/workspace/workspace-project-compact.png
          - assets/electron/workspace/workspace-project-large.png
          - assets/electron/workspace/workspace-return-compact.png
          - assets/electron/workspace/workspace-return-large.png
    blockers: []
    recovery: >-
      Settings keeps harness selection available; wait for backend live status
      before workspace operations, then retry or switch back to the previous
      workspace.
  - id: workspace-context-packs
    title: Create, edit, review and select workspace context packs
    destinations: [workspace]
    status: ok
    evidence:
      - note: >-
          Workspace Hall lists, creates and edits local packs through typed
          backend validation, shows related project references and shared notes,
          and lets the user select a pack for future session context or clear it.
          Edits include content revisions to prevent stale overwrites. Related
          projects are descriptive metadata; notes remain workspace-wide. The
          backend writes inert YAML only and never installs or executes it.
          Electron E2E covers create, edit, notes roundtrip, selection persistence
          after reload, and clearing. Compact and large captures were opened.
        build: "d986b71c5526a55340ef97272a8cec4610565f69 + local pack workflow (Linux Electron E2E, 2026-10-11)"
        tests:
          - apps/desktop/e2e/electron/workspace-packs.spec.ts
          - modules/agent_toolkit_core/workspace_packs_test.v
        screenshots:
          - assets/electron/workspace-packs/workspace-packs-compact.png
          - assets/electron/workspace-packs/workspace-packs-large.png
          - assets/electron/workspace-packs/workspace-pack-editor-compact.png
          - assets/electron/workspace-packs/workspace-pack-editor-large.png
    recovery: >-
      Invalid packs remain visible with backend validation details and cannot
      be selected; clear a stale selection when its file has been removed.
  - id: project-spatial-files
    title: Enter a project and inspect its real files in the World
    destinations: [world, workspace]
    status: ok
    evidence:
      - note: >-
          Ground clicks now route the human player around blocked cells and
          semantic landmarks, while clicking a real entity keeps its canonical
          action. The camera follows during exploration and reframes at crisp
          integer zoom when the viewport changes. Electron E2E walks to a
          pointer destination, waits for arrival, then checks keyboard walking
          up to a project's actual door, presses E to enter that house, then
          uses the real terminal workstation inside. It also checks that typing
          stays local to the command palette. Captures were opened at compact
          and large sizes; the local backend was 1.43 with source renderer 1.44.
        build: "feat/world-click-to-move (Linux Electron E2E; world-walk.spec.ts)"
        tests:
          - apps/desktop/e2e/electron/world-walk.spec.ts
          - apps/desktop/e2e/electron/world-interactions.spec.ts
          - apps/desktop/src/features/world/player.test.ts
        screenshots:
          - assets/electron/world-player-click-to-move/compact.png
          - assets/electron/world-player-click-to-move/large.png
      - note: >-
          Fresh Electron acceptance exposed an initialization race that could
          show the player at provisional coordinates before the real spawn was
          resolved; the test had mistaken that jump for click-to-move. The actor
          now remains hidden until its workspace/map-specific spawn is restored,
          and Electron waits for that ready state before testing click movement.
          Camera transitions synchronously publish their target geometry so a
          queued ResizeObserver cannot restore the previous zoom or mode. The
          source renderer build passed and the real Electron walk/door/terminal
          flows passed with the installed 1.44.0 backend binary. Compact and large
          captures were opened after the fix.
        build: "fix/world-player-camera-follow (source Electron; backend 1.44.0; world-walk + world-interactions)"
        tests:
          - apps/desktop/e2e/electron/world-walk.spec.ts
          - apps/desktop/e2e/electron/world-interactions.spec.ts
          - apps/desktop/src/features/world/WorldEntityMap.test.tsx
          - apps/desktop/src/features/world/camera.test.ts
        screenshots:
          - assets/electron/world-player-click-to-move/compact.png
          - assets/electron/world-player-click-to-move/large.png
          - assets/electron/world-player-exit/compact.png
          - assets/electron/world-player-exit/large.png
      - note: >-
          The World now opens at a player-first exploration scale instead of
          fitting the full valley on first load. The human avatar and camera
          are ready at entry; Fit world remains available for the complete
          workspace overview. Electron E2E verifies initial player visibility,
          pointer and keyboard movement, saved appearance, and that command
          palette typing leaves the player still. First-open compact and large
          captures and a compact walking capture were opened against the
          installed Desktop backend. The screenshot review still identifies
          broad grass and orthogonal routes as unresolved composition work.
        build: "74b25c12 (Electron E2E; installed 1.44.0 backend; world-walk.spec.ts)"
        tests:
          - apps/desktop/e2e/electron/world-walk.spec.ts
          - apps/desktop/src/features/world/WorldEntityMap.test.tsx
          - apps/desktop/src/features/world/player.test.ts
        screenshots:
          - assets/electron/world-player-start-2026-10-13/world-player-start-compact.png
          - assets/electron/world-player-start-2026-10-13/world-player-start-large.png
          - assets/electron/world-player-start-2026-10-13/world-player-walking-compact.png
      - note: >-
          The project's interior door now describes its real action as returning
          to the workspace grounds. Electron E2E walks to that door, checks the
          proximity prompt, presses E, and verifies the valley is restored.
          Compact and large captures were opened after dismissing the project
          receipt and fitting the room to the compact view. The local backend
          was 1.43 while the renderer source was 1.44.
        build: "feat/world-door-return (Linux Electron E2E; 1.43 backend, 1.44 renderer)"
        tests:
          - apps/desktop/e2e/electron/world-interactions.spec.ts
          - apps/desktop/src/features/world/inspectors.test.ts
        screenshots:
          - assets/electron/world-player-exit/compact.png
          - assets/electron/world-player-exit/large.png
      - note: >-
          Project doors now use the browser's shared-element view transition for
          a short pixel-step dissolve when entering or leaving a project. The
          navigation falls back to immediate routing where unsupported and
          bypasses animation for reduced-motion preferences. The
          existing Electron E2E exercises both door directions and the real
          terminal interaction; compact and large interior captures were opened.
        build: "feat/world-door-transitions (Linux Electron E2E; 1.43 backend, 1.44 renderer)"
        tests:
          - apps/desktop/e2e/electron/world-interactions.spec.ts
          - apps/desktop/src/features/world/player.test.ts
        screenshots:
          - assets/electron/world-player-exit/compact.png
          - assets/electron/world-player-exit/large.png
      - note: >-
          The human navigator now offers River, Grove and Ember coats with
          workspace-scoped persistence shared between grounds and interiors.
          The existing walk E2E verifies the selected sprite, stored preference,
          keyboard movement and command-palette typing. Compact and large Linux
          Electron captures were opened and reviewed; this local capture used
