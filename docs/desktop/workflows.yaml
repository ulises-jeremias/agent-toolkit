          integer scaling reaches 80px on the large viewport and stays readable
          at 32px compact. The saved screenshots are from the Electron app and
          canonical backend at the same SHA as the published release.
        build: "ea154c2f192d6844d3f2a2e6a9764de5a5249aa3 (Linux Electron capture; 37445405836)"
