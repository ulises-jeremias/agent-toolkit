# Desktop workflow ledger (Electron + React, ADR-033)
# Declarative companion to WORKFLOW_COVERAGE.md: each journey lists the
# discover → configure/execute → observe → recover state with an honest
# status. A journey is "ok" only with linked reviewed evidence at a recorded
# build SHA; everything else stays a blocker. Generic command/argument
# dialogs and manual declaration file edits never qualify as a journey.
spec: agent-toolkit/desktop-workflows@1
status: current-contract
scope: |
  Electron + React shipping Desktop. The native-V workflow matrix in
  WORKFLOW_COVERAGE.md is historical (ADR-032 retirement, ADR-033); this YAML
  is the current per-journey ledger for the Electron app.
journeys:
  - id: first-run-onboarding
    title: First run to a created or reused workspace
    destinations: [onboarding]
    status: ok
    evidence:
      - note: copied Linux package launched outside the checkout with fresh
          HOME/XDG and minimal PATH, workspace created entirely through the GUI
        build: "1.40.0 @ feat/cozy-pixel-world cb7394b2 (2026-09-30)"
      - note: >-
          First-run E2E covers an existing workspace, explicit creation of a
          missing workspace, and a crashed supervised backend restarted inside
          onboarding before continuing; the package smoke launches from fresh
          HOME/XDG. Compact and large failed-state captures were opened.
        build: "adda39ed (#1472; packaged Electron acceptance and Linux E2E)"
        tests:
          - apps/desktop/e2e/electron/onboarding.spec.ts
        screenshots:
          - assets/electron/onboarding/recovery-backend-failed-compact.png
          - assets/electron/onboarding/recovery-backend-failed-large.png
    blockers: []
    recovery: restart a failed local backend from onboarding; existing workspaces remain unchanged
  - id: workspace-switch-inspect
    title: Switch workspace and read its truth in the World
    destinations: [world, workspace]
    status: ok
    evidence:
      - note: >-
          Electron E2E changes to a second workspace through Settings, links a real project using the GUI, verifies its
          building in World, rejects a missing destination without changing the active workspace, switches back, and
          verifies that the original workspace remains empty. The flow waits for the supervised backend to become
          live after each successful restart; compact and large captures were opened.
        build: "89399a14 (Linux Electron E2E; temporary HOME)"
        tests:
          - apps/desktop/e2e/electron/workspace-switch.spec.ts
        screenshots:
          - assets/electron/workspace/workspace-project-compact.png
          - assets/electron/workspace/workspace-project-large.png
          - assets/electron/workspace/workspace-return-compact.png
          - assets/electron/workspace/workspace-return-large.png
    blockers: []
    recovery: >-
      Settings keeps harness selection available; wait for backend live status
      before workspace operations, then retry or switch back to the previous
      workspace.
