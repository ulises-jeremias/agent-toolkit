          to end: when the run's tmux server dies while the run still
          claims to be running, the typed run reads the Desktop polls
          apply a liveness reconcile that closes the worker's
          PersonSession as `interrupted` (never `failed`: the surface is
          gone, the cause is unknown), traced as person_session_worker_lost.
          The run state stays operator-owned; stopping the run afterwards
          still resolves it. Probe errors prove nothing and close nothing.
        build: "Linux Electron E2E (dead-worker test in swarm-person-session.spec.ts)"
        tests:
          - modules/agent_toolkit_core/swarm_test.v
          - apps/desktop/e2e/electron/swarm-person-session.spec.ts
