          waiting roles as `tmux_agent_started`, so the handoff autostart
          gate believed the reviewer had already launched and only woke a
          window with no runner in it. Waiting roles now trace
          `agent_waiting` (as the herdr path already did), the handoff
          auto-starts the reviewer's runner, and its bound PersonSession
          is recorded and listed in the inspector.
