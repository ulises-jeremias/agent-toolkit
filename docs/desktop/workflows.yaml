# Desktop workflow ledger (Electron + React, ADR-033)
# Declarative companion to WORKFLOW_COVERAGE.md: each journey lists the
# discover → configure/execute → observe → recover state with an honest
# status. A journey is "ok" only with linked reviewed evidence at a recorded
# build SHA; everything else stays a blocker. Generic command/argument
# dialogs and manual declaration file edits never qualify as a journey.
spec: agent-toolkit/desktop-workflows@1
status: current-contract
scope: |
  Electron + React shipping Desktop. The native-V workflow matrix in
  WORKFLOW_COVERAGE.md is historical (ADR-032 retirement, ADR-033); this YAML
  is the current per-journey ledger for the Electron app.
journeys:
  - id: first-run-onboarding
    title: First run to a created or reused workspace
    destinations: [onboarding]
    status: ok
    evidence:
      - note: copied Linux package launched outside the checkout with fresh
          HOME/XDG and minimal PATH, workspace created entirely through the GUI
        build: "1.40.0 @ feat/cozy-pixel-world cb7394b2 (2026-09-30)"
      - note: e2e/electron/onboarding.spec.ts
    blockers: []
    recovery: guided retry on backend failure; no partial workspace left behind
  - id: workspace-switch-inspect
    title: Switch workspace and read its truth in the World
    destinations: [world, workspace]
    status: ok
    evidence:
      - note: Electron E2E changes to a second workspace through Settings, links a real project using the GUI, verifies its building in World, switches back, and verifies that the original workspace remains empty. The flow waits for the supervised backend to become live after each restart.
        build: "8377e06a (Linux Electron E2E; temporary HOME)"
        tests:
          - apps/desktop/e2e/electron/workspace-switch.spec.ts
        screenshots:
          - assets/electron/workspace/workspace-project-compact.png
          - assets/electron/workspace/workspace-project-large.png
          - assets/electron/workspace/workspace-return-compact.png
          - assets/electron/workspace/workspace-return-large.png
    blockers: []
    recovery: Settings keeps harness selection available; wait for backend live status before workspace operations, then retry or switch back to the previous workspace.
  - id: project-spatial-files
    title: Enter a project and inspect its real files in the World
    destinations: [world, workspace]
    status: ok
    evidence:
      - note: Registered project house opens a project overview board; its filing cabinet opens Workspace Files scoped to the registered project root, and the GUI reads a real README through the typed API
        build: "4847b25434c53162fbeb979baa92a97931daf841 (Linux Electron E2E)"
        screenshots:
          - assets/electron/world/project-files-room-compact.png
          - assets/electron/world/project-files-room-large.png
      - note: World composition keeps shared landmarks on the commons bank and registered project houses across a traversable bridge; empty, one-project, and three-project layouts are captured at compact and large viewports, with semantic project link and building entry exercised through the GUI
        build: "9deb8f6b (Linux Electron E2E; project-link.spec.ts)"
        screenshots:
          - assets/electron/world/world-empty-compact.png
          - assets/electron/world/world-empty-large.png
          - assets/electron/world/world-one-project-compact.png
          - assets/electron/world/world-one-project-large.png
          - assets/electron/world/world-several-projects-compact.png
          - assets/electron/world/world-several-projects-large.png
      - note: apps/desktop/e2e/electron/project-link.spec.ts; modules/agent_toolkit_core/file_catalog_test.v covers project symlink containment and unsafe paths
    blockers: []
  - id: capability-discovery
    title: Browse skills/agents/packs in the Library
    destinations: [library]
    status: partial
    evidence:
      - note: Library renders catalog definitions over the serve API
    blockers:
      - no installed-vs-catalog distinction review with mixed states on file
  - id: install-capabilities
    title: Install skills/agents from the Library
    destinations: [library]
    status: blocked
    evidence:
      - note: >-
          The machine profile installer now has a read-only backend preview of detected
          targets, changed paths, preserved conflicts, and stale Toolkit-owned files.
          It installs profiles into coding tools and does not install reusable catalog
          capabilities, so this evidence does not complete the journey.
        tests:
          - apps/desktop/e2e/electron/desktop.spec.ts
        screenshots:
          - assets/electron/library/install-preview-compact.png
          - assets/electron/library/install-preview-large.png
    blockers:
      - GUI install and removal of reusable skills/agent definitions from the catalog is not implemented
  - id: mcp-configure-probe
    title: Configure an MCP provider and probe it
    destinations: [library]
    status: partial
    evidence:
      - note: Library uses a typed secret-free provider catalog. Configure and remove actions preview their exact local MCP registry file; validation checks environment names and template provenance; probe explains that it checks the local executable, not a live model connection.
        tests:
          - apps/desktop/e2e/electron/desktop.spec.ts
          - modules/agent_toolkit_core/mcp_test.v
        screenshots:
          - assets/electron/library/mcp-configure-compact.png
          - assets/electron/library/mcp-configure-large.png
    blockers:
      - Desktop does not manage or store secret values; required values must already be available to the backend launch environment
  - id: jobs-run-observe
    title: Start a job, watch it work, see the outcome
    destinations: [operations, world]
    status: ok
    evidence:
      - note: Operations starts the real `version` job through the backend and shows its output and terminal result; `worldEvents.test.ts` confirms terminal jobs leave the world projection
        build: "9deb8f6b (Linux Electron E2E; desktop.spec.ts and interior.spec.ts)"
        screenshots:
          - assets/electron/world/world-job-completed-large.png
    blockers: []
  - id: terminal-lifecycle
    title: Open, use, and close a real PTY terminal
    destinations: [terminal]
    status: partial
    evidence:
      - note: real node-pty transport over the typed preload bridge
    blockers:
      - exit/reap and restart-on-backend-crash review not on file
  - id: people-crud
    title: Create, edit and archive a Person
    destinations: [people]
    status: ok
    evidence:
      - note: Electron screenshot tour creates Lina through the UI and confirms the offline roster; V people_test.v covers CRUD, archive, restore and invalid declarations
        build: "feat/product-stabilization (pre-merge)"
      - note: Electron E2E creates Milo, edits his goal and appearance, then archives and restores him with explicit confirmations; his offline state persists and archive never starts a session
        build: "feat/desktop-people-import-review (Linux Electron E2E)"
        screenshots:
          - assets/electron/people/people-roster-edit-compact.png
          - assets/electron/people/people-roster-edit-large.png
  - id: people-import-review
    title: Review a munder-difflin/hire@1 import
    destinations: [people]
    status: ok
    evidence:
      - note: Electron screenshot tour reviews Maya JSON, displays ignored command field, saves and observes offline roster; importMunder.test.ts covers inert source mapping
        build: "feat/product-stabilization (pre-merge)"
      - note: Electron review also covers malformed JSON recovery, safe import review, duplicate ID conflict, edit-before-save recovery, and confirms the new Person remains offline
        build: "feat/desktop-people-import-review (Linux Electron E2E)"
        screenshots:
          - assets/electron/people/munder-import-collision-compact.png
          - assets/electron/people/munder-import-collision-large.png
  - id: people-start-session
    title: Start a session as a Person
    destinations: [people, terminal, world]
    status: partial
    evidence:
      - note: People can review project, discovered runner and model, then open a real Electron PTY tagged with Person/project identity; a live PTY plus its saved Person and matching project is projected as a character, including while that real session is stopping
        build: '0af40865e7c0064bcf07efb6322b51652e897b52 (#1368)'
        screenshots:
          - assets/electron/people/people-roster-compact.png
          - assets/electron/people/person-start-compact.png
          - assets/electron/people/person-start-large.png
          - assets/electron/people/world-person-compact.png
          - assets/electron/people/world-person-large.png
          - assets/electron/people/people-offline-after-stop.png
      - note: Ctrl+K Start Person opens the same review flow as People; the active Person command opens its existing PTY; apps/desktop/e2e/electron/people-session.spec.ts covers start, world presence, terminal binding, and verified stop
      - note: After the project-valley layout update, the real Lina PTY character remains beside the linked agent-toolkit house while the PTY is open and disappears from the map after exit is confirmed; captures were regenerated and opened at compact and large sizes
        build: "9deb8f6b (Linux Electron E2E; people-session.spec.ts)"
        screenshots:
          - assets/electron/people/world-person-compact.png
          - assets/electron/people/world-person-large.png
          - assets/electron/people/people-offline-after-stop.png
    blockers:
      - the process is a local PTY binding, not a server-side AgentSession with durable history
      - Person goal/capabilities, budgets, and isolation are not yet enforced by this PTY workflow
  - id: swarm-role-picker
    title: Choose People for swarm roles before start
    destinations: [operations, people]
    status: partial
    evidence:
      - note: >-
          Operations loads the active roster, lets the user explicitly bind one
          Person per canonical recipe role, preserves Auto/ephemeral fallback,
          and submits the typed binding to the backend. The backend validates
          recipe membership, Person existence/archive state and uniqueness,
          persists the binding on the run and exports AGENT_TOOLKIT_PERSON_ID
          as an adapter hint to role processes launched by Herdr/tmux. Agent
          Toolkit does not yet consume that hint to associate an AgentSession,
          terminal, or World character. Headless mode rejects an explicit
          launch request. Runner/model remain swarm-wide settings.
        build: "feat/desktop-swarm-people-bindings (V + Electron E2E)"
        screenshots:
          - assets/electron/swarms/swarm-start-compact.png
          - assets/electron/swarms/swarm-start-large.png
    blockers:
      - preferred compatible Person resolution from people/bindings.yaml is not implemented
      - per-Person provider/model preference and Person-specific terminal actions are not implemented
      - Agent Toolkit does not consume the role-process Person hint as a session identity
      - swarm role sessions are not yet projected into truthful World characters
  - id: swarm-start-review
    title: Review canonical recipe topology and runtime settings before starting
    destinations: [operations]
    status: ok
    evidence:
      - note: >-
          Electron uses the typed canonical recipe catalog to show actual roles,
          personas, policies, model profiles, budgets, approval gates, worktree
          strategy, and push/merge permissions. Runtime options distinguish
          the coding runner from the session adapter and default to a compact
          progressive disclosure section. A dry-run E2E
          verifies the review can be submitted without creating or spawning a run.
        build: "feat/desktop-swarm-recipe-flow (Linux Electron E2E)"
        screenshots:
          - assets/electron/swarms/swarm-start-compact.png
          - assets/electron/swarms/swarm-start-large.png
    blockers: []
  - id: loops-run-report
    title: Install a loop template, run once and read its report
    destinations: [operations]
    status: ok
    evidence:
      - note: >-
          Focused Electron journey adds daily-triage through reviewed
          confirmation, runs it with the skeleton runner, then reads typed
          history/audit and honest unavailable cost; compact and large
          screenshots are reviewed.
        build: "233b9159 (Linux Electron E2E; loops.spec.ts)"
        screenshots:
          - assets/electron/loops/loop-report-compact.png
          - assets/electron/loops/loop-report-large.png
          - assets/electron/loops/loop-report-after-run.png
      - note: >-
          V core tests cover embedded template discovery/read; a packaged-style
          binary from fresh HOME/XDG lists embedded templates and initializes
          one.
        build: "feat/desktop-loop-reports (VJOBS=2 local validation)"
    blockers: []
  - id: loops-schedule
    title: Preview, create and disable a loop schedule
    destinations: [operations]
    status: ok
    evidence:
      - note: >-
          Operations reads actual scheduler inventory, previews generated unit
          paths and cadence, exposes exact scheduler files on demand, installs
          and removes user-level units through the canonical loops operation,
          escapes systemd workspace paths, and reports partial scheduler
          changes with a working retry action. Electron E2E uses an isolated
          HOME and first-in-PATH fake systemctl to verify failure, recovery,
          file creation, list, and removal without changing the host scheduler.
        build: "884a9dbb (Linux Electron E2E; loops.spec.ts)"
        screenshots:
          - assets/electron/loops/loop-schedule-preview-compact.png
          - assets/electron/loops/loop-schedule-preview-large.png
          - assets/electron/loops/loop-schedule-recovery-compact.png
          - assets/electron/loops/loop-schedule-recovery-large.png
    blockers: []
  - id: swarm-run-watch
    title: Run a swarm and watch lane progress
    destinations: [operations]
    status: partial
    evidence:
      - note: >-
          Operations refreshes active swarm lists and the selected run, shows
          backend state transitions made through the CLI, and inspects real
          approvals, tasks, handoffs, artifacts, and trace entries. The
          reviewed Electron E2E starts a headless run record, observes external
          run/pause changes, resumes it in Desktop, and stops it. Headless is
          identified explicitly and does not imply that agents are running.
        build: "feat/desktop-swarm-live-watch (Linux Electron E2E)"
        screenshots:
          - assets/electron/swarms/swarm-run-watch-compact.png
          - assets/electron/swarms/swarm-run-watch-large.png
        tests:
          - apps/desktop/e2e/electron/desktop.spec.ts
    blockers:
      - adapter-backed worker starts, handoff progress, and failure recovery are not yet verified in an end-to-end Desktop run
  - id: universal-search-actions
    title: Search and launch core actions with safe previews
    destinations: [shell]
    status: partial
    evidence:
      - note: Typed palette actions map navigation, project houses, People, terminal, jobs, loops, swarm start, workspace chooser, and attention to existing GUI routes. Electron E2E exercises terminal/job/loop/swarm dialogs, workspace chooser focus, project entry, and backend restart reviews from both the palette and Settings. Both restart reviews default focus to Cancel; the palette review is captured at compact and large sizes.
        build: "feat/desktop-palette-reachability (Linux Electron E2E)"
        screenshots:
          - assets/electron/palette/backend-restart-compact.png
          - assets/electron/palette/backend-restart-large.png
        tests:
          - apps/desktop/e2e/electron/desktop.spec.ts
          - apps/desktop/e2e/electron/project-link.spec.ts
      - note: >-
          Direct palette commands open the existing People create form and an
          explicit Munder file chooser/review, dynamically list installed loop
          schedule controls, and select recoverable swarm runs in Operations.
          E2E confirms import remains unsaved and inert, schedule previews still
          gate changes, and a paused run can be resumed from its canonical
          inspector after palette navigation.
        build: "feat/desktop-world-semantic-actions (Linux Electron E2E)"
        screenshots:
          - assets/electron/palette/people-create-compact.png
          - assets/electron/palette/people-create-large.png
          - assets/electron/palette/munder-review-compact.png
          - assets/electron/palette/munder-review-large.png
        tests:
          - apps/desktop/e2e/electron/desktop.spec.ts
          - apps/desktop/e2e/electron/loops.spec.ts
    blockers:
      - direct palette actions for capability installation and MCP configuration remain incomplete because those mutation journeys do not yet have complete canonical Desktop workflows
