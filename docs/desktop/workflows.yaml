# Desktop workflow ledger (Electron + React, ADR-033)
# Declarative companion to WORKFLOW_COVERAGE.md: each journey lists the
# discover → configure/execute → observe → recover state with an honest
# status. A journey is "ok" only with linked reviewed evidence at a recorded
# build SHA; everything else stays a blocker. Generic command/argument
# dialogs and manual declaration file edits never qualify as a journey.
spec: agent-toolkit/desktop-workflows@1
status: current-contract
scope: |
  Electron + React shipping Desktop. The native-V workflow matrix in
  WORKFLOW_COVERAGE.md is historical (ADR-032 retirement, ADR-033); this YAML
  is the current per-journey ledger for the Electron app.
journeys:
  - id: first-run-onboarding
    title: First run to a created or reused workspace
    destinations: [onboarding]
    status: ok
    evidence:
      - note: copied Linux package launched outside the checkout with fresh
          HOME/XDG and minimal PATH, workspace created entirely through the GUI
        build: "1.40.0 @ feat/cozy-pixel-world cb7394b2 (2026-09-30)"
      - note: e2e/electron/onboarding.spec.ts
    blockers: []
    recovery: guided retry on backend failure; no partial workspace left behind
  - id: workspace-switch-inspect
    title: Switch workspace and read its truth in the World
    destinations: [world, workspace]
    status: partial
    evidence: []
    blockers:
      - per-state visual evidence at compact and large viewports reviewed in a PR, not yet on file
  - id: capability-discovery
    title: Browse skills/agents/packs in the Library
    destinations: [library]
    status: partial
    evidence:
      - note: Library renders catalog definitions over the serve API
    blockers:
      - no installed-vs-catalog distinction review with mixed states on file
  - id: install-capabilities
    title: Install skills/agents from the Library
    destinations: [library]
    status: blocked
    evidence: []
    blockers:
      - destructive-action preview and rollback review not on file
  - id: mcp-configure-probe
    title: Configure an MCP provider and probe it
    destinations: [settings, operations]
    status: blocked
    evidence: []
    blockers:
      - typed MCP configuration journey without manual file edits not implemented
  - id: jobs-run-observe
    title: Start a job, watch it work, see the outcome
    destinations: [operations, world]
    status: ok
    evidence:
      - note: GUI-started `build --check` figure appears in the world on run and
          disappears on completion (captured 2026-09-30 pre-restart run, reopening
          pending on this rebuild)
      - note: e2e/electron/desktop.spec.ts
    blockers: []
  - id: terminal-lifecycle
    title: Open, use, and close a real PTY terminal
    destinations: [terminal]
    status: partial
    evidence:
      - note: real node-pty transport over the typed preload bridge
    blockers:
      - exit/reap and restart-on-backend-crash review not on file
  - id: people-crud
    title: Create, edit and archive a Person
    destinations: [people]
    status: partial
    evidence:
      - note: Electron screenshot tour creates Lina through the UI and confirms the offline roster; V people_test.v covers CRUD, archive, restore and invalid declarations
        build: "feat/product-stabilization (pre-merge)"
    blockers:
      - GUI edit/archive/restore failure paths need full Electron review
  - id: people-import-review
    title: Review a munder-difflin/hire@1 import
    destinations: [people]
    status: partial
    evidence:
      - note: Electron screenshot tour reviews Maya JSON, displays ignored command field, saves and observes offline roster; importMunder.test.ts covers inert source mapping
        build: "feat/product-stabilization (pre-merge)"
    blockers:
      - malformed-file and collision recovery need full Electron review
  - id: people-start-session
    title: Start a session as a Person
    destinations: [people, terminal, world]
    status: partial
    evidence:
      - note: People can review project, discovered runner and model, then open a real Electron PTY tagged with Person/project identity; only a live PTY plus a saved, non-archived Person is projected as a character in that project
        build: 'feat/desktop-people-session (local, pending review)'
      - note: focused Electron terminal, Person runner-option and world-model tests
    blockers:
      - the process is a local PTY binding, not a server-side AgentSession with durable history
      - Person goal/capabilities, budgets, and isolation are not yet enforced by this PTY workflow
  - id: swarm-role-picker
    title: Choose People for swarm roles before start
    destinations: []
    status: not-implemented
    evidence: []
    blockers:
      - resolution order (explicit Person, preferred Person, ephemeral session) is contract-only
  - id: loops-run-report
    title: Install a loop template, run once and read its report
    destinations: [operations]
    status: partial
    evidence:
      - note: focused Electron journey adds daily-triage through a reviewed confirmation, runs it with the skeleton runner, then reads typed history/audit and honest unavailable cost; compact and large screenshots reviewed locally
        build: "feat/desktop-loop-reports (local; CI review pending)"
        screenshots:
          - assets/electron/loops/loop-report-compact.png
          - assets/electron/loops/loop-report-large.png
          - assets/electron/loops/loop-report-after-run.png
      - note: V core tests cover embedded template discovery/read, and a packaged-style binary from fresh HOME/XDG lists 10 embedded templates and initializes one
        build: "feat/desktop-loop-reports (VJOBS=2 local validation)"
    blockers:
      - Desktop scheduling, pause/disable and schedule recovery are not exposed yet
      - packaged CI evidence for this branch is pending
  - id: loops-schedule
    title: Preview, create and disable a loop schedule
    destinations: [operations]
    status: not-implemented
    evidence: []
    blockers:
      - schedule lifecycle requires a dedicated preview and typed Desktop workflow
  - id: swarm-run-watch
    title: Run a swarm and watch lane progress
    destinations: [operations]
    status: blocked
    evidence: []
    blockers:
      - swarm run/watch journey against the current build not on file
  - id: universal-search-actions
    title: Search/Run palette reaches everything with permission preview
    destinations: [shell]
    status: blocked
    evidence: []
    blockers:
      - typed action registry reachability for critical journeys not on file for Electron
