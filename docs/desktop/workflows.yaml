  - id: capability-discovery
    title: Browse skills/agents/packs in the Library
    destinations: [library]
    status: partial
    evidence:
      - note: Library renders catalog definitions over the serve API
      - note: >-
          Skills and Agent Definitions now show per-resource Toolkit receipt state
          beside catalog membership. The state is derived from receipt-owned
          artifacts and their current digest checks: verified, needs attention,
          partial receipt, or no receipt. Partial means support files have
          Toolkit receipts but the primary Skill file remains user-owned. No
          receipt does not claim that a user-managed copy is absent. Electron
          E2E covers verified installs, an edited artifact, and a pre-existing
          user file that Toolkit preserved.
        build: "desktop Library receipt-state slice"
        tests:
          - apps/desktop/src/features/library/resourceEvidence.test.ts
          - apps/desktop/e2e/electron/desktop.spec.ts
        screenshots:
          - assets/electron/library/catalog-install-evidence-compact.png
          - assets/electron/library/catalog-install-evidence-large.png
          - assets/electron/library/catalog-partial-receipt-compact.png
          - assets/electron/library/catalog-partial-receipt-large.png
          - ../../static/screenshots/library.png
    blockers:
      - >-
          Capability catalog search, provenance, dependencies, and verified
          compatibility are not yet available together in the Library.
  - id: install-capabilities
    title: Install skills/agents from the Library
    destinations: [library]
    status: partial
    evidence:
      - note: >-
          Library previews the actual profile, Agent Definition, and complete Skill file
          transaction for detected tools, including references, user conflicts, and target
          paths for explicitly selected tools. The GUI applies only the reviewed targets,
          then lists secret-free receipt evidence with target, product, version, artifact
          counts, and local receipt path. Removal preview is receipt-backed; confirmation
          is bound to a backend snapshot and uses atomic quarantine before deletion.
          GitHub Copilot remains a separate repository-scoped capability and is not
          installed by this user-level flow. Desktop can review the actual
          packaged Copilot instruction contents and destination for one linked
          project before applying; it rejects unsafe
          destination symlinks, preserves existing instructions, checks the
          reviewed project snapshot before writing, and records a real receipt.
          Receipt-backed removal rechecks the file digest and leaves any
          post-install user edits intact.
          The screenshot tour covers this review at compact and large sizes.
        tests:
          - apps/desktop/e2e/electron/desktop.spec.ts
          - apps/desktop/e2e/electron/project-link.spec.ts
          - apps/desktop/src/lib/api/api.test.ts
          - modules/agent_toolkit_core/copilot_project_install_test.v
          - modules/agent_toolkit_core/install_test.v
          - modules/agent_toolkit_core/uninstall_test.v
          - modules/agent_toolkit_server/server_integration_test.v
        screenshots:
          - assets/electron/library/install-preview-compact.png
          - assets/electron/library/install-preview-large.png
          - assets/electron/library/installation-receipts-compact.png
          - assets/electron/library/installation-receipts-large.png
          - assets/electron/library/removal-preview-compact.png
          - assets/electron/library/removal-preview-large.png
          - assets/electron/library/copilot-project-review-compact.png
          - assets/electron/library/copilot-project-review-large.png
      - note: >-
          The installation evidence panel now checks each receipt artifact's
          SHA-256 against its recorded digest and reports unchanged, edited,
          missing, replaced-by-symlink, or unverifiable state. Refresh reruns
          this read-only check; file contents and digests are never returned.
          The expanded detail exposes receipt-owned paths and ownership only
          on demand, and the Electron E2E verifies that an edited user file is
          identified while an unreceipted file stays untouched.
        build: "feature/library-artifact-evidence (Linux Electron E2E; CLI 1.42.0)"
        tests:
          - modules/agent_toolkit_server/server_test.v
          - apps/desktop/e2e/electron/desktop.spec.ts
        screenshots:
          - assets/electron/library/install-evidence-2026-10-07/installation-receipts-compact.png
          - assets/electron/library/install-evidence-2026-10-07/installation-receipts-large.png
          - assets/electron/library/install-evidence-2026-10-07/installation-artifact-evidence-compact.png
          - assets/electron/library/install-evidence-2026-10-07/installation-artifact-evidence-large.png
          - assets/electron/library/installation-receipts-compact.png
          - assets/electron/library/installation-receipts-large.png
          - assets/electron/library/removal-preview-compact.png
          - assets/electron/library/removal-preview-large.png
          - assets/electron/library/copilot-project-review-compact.png
          - assets/electron/library/copilot-project-review-large.png
    blockers:
      - >-
          Compiled Copilot repository Skills and Agent Definitions are not yet
          exposed in Desktop; the current project flow installs only the
          instruction profile.
  - id: mcp-configure-probe
    title: Configure an MCP provider and probe it
    destinations: [library]
    status: ok
    evidence:
      - note: >-
          Library uses a typed secret-free provider catalog and offers
          OS-encrypted credential entry. Saved names are visible but values are
          never returned; credentials are injected only into the supervised
          backend process on restart and are redacted from backend startup
          diagnostics. Configure and remove preview the exact local registry
          file; validation checks environment names/template provenance; probe
          explains that it checks the local executable, not a live model
          connection. Headless Linux without a secure keyring fails closed,
          disables credential entry, and explains that no value was saved.
        tests:
          - apps/desktop/electron/mcp-secrets.test.ts
          - apps/desktop/electron/backend.test.ts
          - apps/desktop/e2e/electron/desktop.spec.ts
          - modules/agent_toolkit_core/mcp_test.v
        screenshots:
          - assets/electron/library/mcp-configure-compact.png
          - assets/electron/library/mcp-configure-large.png
          - assets/electron/library/mcp-credentials-compact.png
          - assets/electron/library/mcp-credentials-large.png
    blockers: []
