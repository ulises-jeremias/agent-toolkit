          MCP commands open the provider's review dialog without applying the
          change; both journeys continue through their canonical Library flows.
        build: "feat/desktop-library-palette-actions (Linux Electron E2E)"
        screenshots:
          - assets/electron/library/install-preview-compact.png
          - assets/electron/library/install-preview-large.png
          - assets/electron/library/mcp-configure-compact.png
          - assets/electron/library/mcp-configure-large.png
        tests:
          - apps/desktop/src/shell/commands.test.ts
          - apps/desktop/e2e/electron/desktop.spec.ts
    blockers: []
