# Typed response schemas and server-native endpoints for `agent-toolkit serve`.
#
# SSOT for the `components.schemas` section and the non-contract paths of
# docs/surface/openapi.json (scripts/generate_surface.vsh). Contract-mirrored
# routes stay in cli-contract.yaml.
#
# Field grammar: `name[?]:type[=a|b|c]`
#   type  = string | boolean | integer | number | object
#         | #Schema (reference) | <type>[] (array) | map<type> (string-keyed object)
#   `?`   = optional (omitted from `required`)
#   `=..` = enum values (string fields only)
#
# tests/test_surface_parity.py checks every schema against the V struct named
# by `v_struct` (default: `name`) in modules/agent_toolkit_server: same JSON
# field names (honouring @[json: '...']) and compatible types.

schemas:
  - name: ApiError
    v_struct: DenyErr
    description: Error body for every non-2xx JSON response.
    fields:
      - ok:boolean
      - error:string

  - name: MessageResponse
    v_struct: MsgResp
    description: Generic success acknowledgement.
    fields:
      - ok:boolean
      - message:string

  - name: VersionResponse
    v_struct: VersionResp
    fields:
      - ok:boolean
      - version:string
      - commit:string
      - uptime_s:integer

  - name: SelfcheckCheck
    fields:
      - name:string
      - status:string=ok|warn|err
      - detail:string

  - name: SelfcheckResponse
    v_struct: SelfcheckResp
    fields:
      - ok:boolean
      - version:string
      - commit:string
      - 'checks:#SelfcheckCheck[]'

  - name: Job
    description: A supervised `agent-toolkit` subprocess run.
    fields:
      - id:string
      - cmd:string
      - args:string[]
      - status:string=queued|running|completed|failed|canceled|rejected
      - started_at:string
      - ended_at:string
      - exit_code:integer
      - workspace:string
      - retry_of:string

  - name: ApiEvent
    description: >-
      One entry of the global event stream (GET /api/v1/events). `seq` is
      monotonic per server process, `boot` identifies that process, and the
      SSE `id` is `<boot>-<seq>`. `subject` is the job id, loop name, swarm
      run id or memory entry type the event is about; `exit_code` is only
      meaningful for job.* and loop.* events.
    fields:
      - seq:integer
      - boot:string
      - type:string=backend.ready|backend.resync|job.created|job.updated|job.deleted|loop.started|loop.finished|swarm.changed|memory.changed|install.started|install.finished
      - at:string
      - subject:string
      - status:string
      - exit_code:integer
      - ref:string
      - message:string

  - name: AgentInfo
    description: One persona from agents/<id>/AGENT.md.
    fields:
      - id:string
      - name:string
      - kind:string
      - description:string
      - source_file:string

  - name: AgentsResponse
    fields:
      - ok:boolean
      - 'agents:#AgentInfo[]'

  - name: ToolInfo
    description: >-
      Coding-agent CLI discovery. detected = binary on PATH;
      configured = a known settings sentinel exists; enabled is
      `unknown` until serve owns an enablement store; verified =
      `--version` exited 0. install_hint is empty unless a real
      first-party install argv exists.
    fields:
      - id:string
      - tool_name:string
      - detected:boolean
      - configured:boolean
      - enabled:string=unknown|true|false
      - verified:boolean
      - resolved_path:string
      - config_paths:string[]
      - version:string
      - reason:string
      - install_hint:string

  - name: ToolsResponse
    fields:
      - ok:boolean
      - 'tools:#ToolInfo[]'

  - name: ProviderInfo
    description: A swarm runner CLI. `auto` is a resolver and is omitted.
    fields:
      - id:string
      - bin:string
      - available:boolean
      - capability:string
      - version:string

  - name: ProvidersResponse
    fields:
      - ok:boolean
      - 'providers:#ProviderInfo[]'

  - name: ModelInfo
    description: One (profile, runner) slot from swarm_model_profiles.
    fields:
      - profile:string
      - runner:string
      - model:string

  - name: ModelsResponse
    fields:
      - ok:boolean
      - 'models:#ModelInfo[]'

  - name: MemoryProvenance
    description: >-
      Honest origin for a knowledge file. author is the last git committer
      on read when `.git` exists; agent is empty unless a real source
      records it. timestamp is the first YYYY-MM-DD in the file, else mtime.
    fields:
      - file:string
      - author:string
      - timestamp:string
      - project:string
      - agent:string

  - name: MemoryEntry
    description: One memory file (learnings, processes, or todos). body is set on read and empty on list. Other knowledge/*.md files are not memory.
    fields:
      - id:string
      - kind:string
      - title:string
      - snippet:string
      - body:string
      - tags:string[]
      - 'provenance:#MemoryProvenance'

  - name: MemoryHit
    description: One line match from GET /api/v1/memory/hits.
    fields:
      - path:string
      - line:integer
      - snippet:string
      - kind:string

  - name: MemoryListResponse
    fields:
      - ok:boolean
      - 'entries:#MemoryEntry[]'

  - name: MemorySearchResponse
    fields:
      - ok:boolean
      - query:string
      - 'hits:#MemoryHit[]'

  - name: MemoryReadResponse
    fields:
      - ok:boolean
      - 'entry:#MemoryEntry'

  - name: MemoryWriteResponse
    fields:
      - ok:boolean
      - message:string
      - path:string

  - name: SwarmRunInfo
    fields:
      - run_id:string
      - recipe:string
      - backend:string
      - run_state:string
      - created_at:string
      - task:string

  - name: SwarmListResponse
    fields:
      - ok:boolean
      - 'runs:#SwarmRunInfo[]'

  - name: SwarmBudgetView
    fields:
      - max_total_tokens:integer
      - total_tokens:integer
      - max_cost_usd:number
      - total_cost:number
      - max_wall_seconds:integer
      - cost_status:string=accounted|unavailable

  - name: SwarmGate
    fields:
      - id:string
      - description:string
      - required:boolean
      - approved:boolean
      - rejected:boolean
      - reason:string

  - name: SwarmHandoffView
    fields:
      - id:string
      - htype:string
      - from_role:string
      - to_role:string
      - priority:integer
      - artifact:string
      - commit:string
      - branch:string
      - blocking:boolean
      - state:string
      - created_at:string

  - name: SwarmTaskView
    fields:
      - id:string
      - status:string
      - priority:integer
      - owner:string
      - from_role:string
      - dependencies:string
      - blocked_reason:string
      - created_at:string

  - name: SwarmArtifactView
    fields:
      - name:string
      - path:string
      - size:integer

  - name: SwarmRunResponse
    fields:
      - ok:boolean
      - 'run:#SwarmRunInfo'
      - runner:string
      - model:string
      - 'budget:#SwarmBudgetView'
      - 'approvals:#SwarmGate[]'
      - 'handoffs:#SwarmHandoffView[]'
      - 'tasks:#SwarmTaskView[]'
      - 'artifacts:#SwarmArtifactView[]'
      - trace_tail:string[]

  - name: SwarmHandoffsResponse
    fields:
      - ok:boolean
      - run_id:string
      - 'handoffs:#SwarmHandoffView[]'

  - name: SwarmTasksResponse
    fields:
      - ok:boolean
      - run_id:string
      - 'tasks:#SwarmTaskView[]'

  - name: SwarmApprovalsResponse
    fields:
      - ok:boolean
      - run_id:string
      - 'approvals:#SwarmGate[]'

  - name: SwarmArtifactsResponse
    fields:
      - ok:boolean
      - run_id:string
      - 'artifacts:#SwarmArtifactView[]'

  - name: SwarmActionResponse
    fields:
      - ok:boolean
      - message:string
      - run_id:string
      - status:string

  - name: LoopInfo
    fields:
      - name:string
      - tier:string
      - cadence:string
      - goal:string
      - runs:integer
      - last:string
      - status:string

  - name: LoopListResponse
    fields:
      - ok:boolean
      - 'loops:#LoopInfo[]'

  - name: LoopBudgetView
    fields:
      - max_tokens:integer
      - max_runs_per_day:integer
      - max_wall_seconds:integer
      - cost_status:string=unavailable|accounted

  - name: LoopStatusResponse
    fields:
      - ok:boolean
      - 'info:#LoopInfo'
      - 'budget:#LoopBudgetView'

  - name: LoopAuditResponse
    fields:
      - ok:boolean
      - name:string
      - completed:integer
      - failed:integer
      - tokens:integer
      - rate:string

  - name: LoopHistoryEntry
    fields:
      - id:string
      - status:string

  - name: LoopHistoryResponse
    fields:
      - ok:boolean
      - name:string
      - last_id:string
      - last:string
      - status:string
      - 'runs:#LoopHistoryEntry[]'

  - name: LoopCostResponse
    fields:
      - ok:boolean
      - name:string
      - cost_status:string=unavailable|accounted
      - detail:string

# Server-native endpoints (ADR-030): capabilities of the API itself, not
# mirrors of CLI contract commands. `response` is a field type (see grammar),
# `text` (text/plain) or `sse` (text/event-stream of `event_schema`).
# `errors` lists `code:description` pairs answered with #ApiError.
native:
  - path: /api/v1/health
    method: get
    op: health
    response: '#VersionResponse'
  - path: /api/v1/openapi.json
    method: get
    op: get_openapi
    response: text
  - path: /api/v1/selfcheck
    method: get
    op: selfcheck
    response: '#SelfcheckResponse'
  - path: /api/v1/jobs
    method: post
    op: create_job
    response: '#Job'
    errors:
      - '400:invalid JSON body or workspace path'
      - '403:workspace outside allowed roots'
      - '404:workspace not found'
      - '422:cmd is required'
      - '429:max concurrent jobs reached'
  - path: /api/v1/jobs
    method: get
    op: list_jobs
    summary: List jobs keyed by id
    response: 'map<#Job>'
  - path: /api/v1/jobs/{id}
    method: get
    op: get_job
    summary: Get one job
    response: '#Job'
    errors:
      - '400:invalid job id'
      - '404:job not found'
  - path: /api/v1/jobs/{id}/log
    method: get
    op: get_job_log
    response: text
  - path: /api/v1/jobs/{id}/events
    method: get
    op: stream_job_events
    response: sse
  - path: /api/v1/jobs/{id}/cancel
    method: post
    op: cancel_job
    response: '#Job'
    errors:
      - '400:invalid job id'
      - '404:job not found'
      - '409:job already terminal'
  - path: /api/v1/jobs/{id}/retry
    method: post
    op: retry_job
    summary: Re-run a failed or canceled job as a new job
    response: '#Job'
    errors:
      - '400:invalid job id'
      - '403:workspace outside allowed roots'
      - '404:job or workspace not found'
      - '409:job is not failed or canceled'
      - '429:max concurrent jobs reached'
  - path: /api/v1/jobs/{id}
    method: delete
    op: delete_job
    response: '#MessageResponse'
    errors:
      - '400:invalid job id'
      - '404:job not found'
      - '409:job is running (use ?force=true)'
  - path: /api/v1/events
    method: get
    op: stream_events
    summary: Global server event stream (SSE)
    response: sse
    event_schema: ApiEvent
    errors:
      - '400:invalid since or Last-Event-ID'
      - '503:too many event subscribers'
  - path: /api/v1/agents
    method: get
    op: list_agents
    summary: Persona catalog from agents/*/AGENT.md
    response: '#AgentsResponse'
  - path: /api/v1/tools
    method: get
    op: list_tools
    summary: Coding-agent CLI discovery (detected/configured/enabled/verified)
    response: '#ToolsResponse'
  - path: /api/v1/providers
    method: get
    op: list_providers
    summary: Swarm runner CLIs
    response: '#ProvidersResponse'
  - path: /api/v1/models
    method: get
    op: list_models
    summary: Swarm model profile slots
    response: '#ModelsResponse'
  - path: /api/v1/memory
    method: get
    op: list_memory
    summary: Memory files (learnings, processes, todos). Empty when no workspace.
    response: '#MemoryListResponse'
    errors:
      - '400:invalid workspace'
      - '403:workspace outside allowed roots'
  - path: /api/v1/memory/hits
    method: get
    op: search_memory
    summary: Case-insensitive memory search
    response: '#MemorySearchResponse'
    errors:
      - '400:query is required'
      - '403:workspace outside allowed roots'
      - '404:workspace not found'
  - path: /api/v1/memory/file
    method: get
    op: read_memory
    summary: Read one memory markdown file
    response: '#MemoryReadResponse'
    errors:
      - '400:invalid path'
      - '403:path outside knowledge/'
      - '404:memory file not found'
  - path: /api/v1/memory/file
    method: post
    op: add_memory
    summary: Add a learning, process, or todo entry
    response: '#MemoryWriteResponse'
    errors:
      - '400:invalid body or entry_type'
      - '403:workspace outside allowed roots'
      - '404:workspace not found'
  - path: /api/v1/memory/file
    method: put
    op: edit_memory
    summary: Replace a memory markdown file
    response: '#MemoryWriteResponse'
    errors:
      - '400:invalid path or content'
      - '403:path outside knowledge/'
      - '404:memory file not found'
  - path: /api/v1/memory/file/archive
    method: post
    op: archive_memory
    summary: Move a memory file under knowledge/archive/
    response: '#MemoryWriteResponse'
    errors:
      - '400:invalid path'
      - '403:path outside knowledge/'
      - '404:memory file not found'
      - '409:already archived'
  - path: /api/v1/doctor/fix
    method: post
    op: doctor_fix
    response: '#MessageResponse'
  - path: /api/v1/loops/{name}/status
    method: get
    op: loop_status_by_name
    response: '#LoopStatusResponse'
    errors:
      - '400:invalid loop name'
      - '404:loop not found'
  - path: /api/v1/loops/{name}/audit
    method: get
    op: loop_audit_by_name
    response: '#LoopAuditResponse'
    errors:
      - '400:invalid loop name'
      - '404:loop not found'
  - path: /api/v1/loops/{name}/history
    method: get
    op: loop_history_by_name
    response: '#LoopHistoryResponse'
    errors:
      - '400:invalid loop name'
      - '404:loop not found'
  - path: /api/v1/loops/{name}/cost
    method: get
    op: loop_cost_by_name
    response: '#LoopCostResponse'
    errors:
      - '400:invalid loop name'
      - '404:loop not found'
  - path: /api/v1/loops/{name}/run
    method: post
    op: run_loop_by_name
  - path: /api/v1/loops/{name}/schedule
    method: post
    op: schedule_loop_by_name
  - path: /api/v1/swarms
    method: get
    op: list_swarms
    response: '#SwarmListResponse'
  - path: /api/v1/swarms/runs/{id}
    method: get
    op: get_swarm_run
    response: '#SwarmRunResponse'
    errors:
      - '400:invalid run_id'
      - '404:run not found'
  - path: /api/v1/swarms/runs/{id}/handoffs
    method: get
    op: list_swarm_handoffs
    response: '#SwarmHandoffsResponse'
    errors:
      - '400:invalid run_id'
      - '404:run not found'
  - path: /api/v1/swarms/runs/{id}/tasks
    method: get
    op: list_swarm_tasks
    response: '#SwarmTasksResponse'
    errors:
      - '400:invalid run_id'
      - '404:run not found'
  - path: /api/v1/swarms/runs/{id}/approvals
    method: get
    op: list_swarm_approvals
    response: '#SwarmApprovalsResponse'
    errors:
      - '400:invalid run_id'
      - '404:run not found'
  - path: /api/v1/swarms/runs/{id}/artifacts
    method: get
    op: list_swarm_artifacts
    response: '#SwarmArtifactsResponse'
    errors:
      - '400:invalid run_id'
      - '404:run not found'
  - path: /api/v1/swarms/runs/{id}/approve
    method: post
    op: approve_swarm_run
    response: '#SwarmActionResponse'
    errors:
      - '400:invalid gate_id'
      - '404:run or gate not found'
  - path: /api/v1/swarms/runs/{id}/reject
    method: post
    op: reject_swarm_run
    response: '#SwarmActionResponse'
    errors:
      - '400:reason required'
      - '404:run or gate not found'
  - path: /api/v1/swarms/runs/{id}/stop
    method: post
    op: stop_swarm_run
    response: '#SwarmActionResponse'
    errors:
      - '400:invalid run_id'
      - '404:run not found'
  - path: /api/v1/loops
    method: get
    op: list_loops
    response: '#LoopListResponse'
