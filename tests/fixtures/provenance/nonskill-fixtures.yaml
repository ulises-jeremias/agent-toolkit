# Fixture: non-skill capabilities (agent / mcp / plugin) — same provenance lock abstraction
# These are test fixtures showing lock identity does not assume skills/<domain>/<name>/SKILL.md
# No production manifests are created; these validate kind-agnostic identity.

# Agent capability — e.g. future agents/design-critic
agent_design_critic:
  capability: agents/design-critic
  kind: agent
  origin: upstream
  sources:
    upstream:
      repository: anthropics/agents
      path: agents/design-critic
      ref: cccccccccccccccccccccccccccccccccccccccc
      license: Apache-2.0

# MCP provider capability
mcp_github:
  capability: mcp/github
  kind: mcp
  origin: upstream
  sources:
    upstream:
      repository: modelcontextprotocol/servers
      path: src/github
      requested:
        type: tag
        ref: v1.2.3
      resolved:
        commit: dddddddddddddddddddddddddddddddddddddddd
        content_checksum: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        license:
          spdx: MIT
        resolved_at: "2026-08-11T00:00:00Z"

# Plugin capability — native-plugin distribution example
plugin_figma:
  capability: plugins/figma
  kind: plugin
  origin: upstream
  distribution: native-plugin
  sources:
    upstream:
      repository: figma/plugin-api
      path: plugin
      tracking:
        type: tag
        ref: v2.0.0
      license: MIT

# First-party counterpart — must NOT appear in lock (sparse)
first_party_assistant:
  capability: core/assistant
  origin: first-party
  note: no lock entry — nothing external to resolve
