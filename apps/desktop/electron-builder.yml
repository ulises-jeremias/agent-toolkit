appId: com.agent-toolkit.desktop
productName: Agent Toolkit
artifactName: agent-toolkit-desktop-${version}-${os}-${arch}.${ext}
copyright: Copyright © ulises-jeremias
asar: true
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  # Bundled V backend: release automation places the platform binary at
  # resources/bin/agent-toolkit(.exe). Electron falls back to PATH in dev.
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
  # Staged backend version pin (written by `pnpm stage:backend`, which the
  # dist scripts always run first). Lets the app detect a stale bundle.
  - from: resources/backend-version.json
    to: backend-version.json
directories:
  output: release
  buildResources: build
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: ulises-jeremias
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
win:
  target:
    - nsis
publish: null
