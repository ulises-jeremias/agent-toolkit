# MCP Provider: github
# Official: https://github.com/github/github-mcp-server
# Note: @modelcontextprotocol/server-github is deprecated (Apr 2025).
id: github
display_name: GitHub
purpose: Access GitHub repositories, issues, PRs, code, and CI via the official GitHub MCP server
implementation:
  provenance: official
  package: ghcr.io/github/github-mcp-server@sha256:fbec75de11c255213fa08d80fb166abe73d851fff631c51c0079872967720699 # pinned digest for latest, see https://github.com/github/github-mcp-server
  repository: https://github.com/github/github-mcp-server
  license: MIT
  version_policy: pin image digest or minor tag
transport:
  supported: [stdio]
  preferred: stdio
auth:
  supported: [bearer-env, oauth]
  preferred: bearer-env
  env: [GITHUB_PERSONAL_ACCESS_TOKEN]
tools:
  read:
    - get_file_contents
    - list_issues
    - get_issue
    - list_pull_requests
    - get_pull_request
    - search_repositories
    - search_code
  write:
    - create_issue
    - create_pull_request
    - create_or_update_file
  destructive:
    - delete_file
approval:
  default: read-only
healthcheck:
  strategy: tools-list
  timeout_ms: 8000
platforms:
  claude-code: native
  cursor: native
  opencode: bridged
  copilot-cli: native
  gemini-cli: native
  windsurf: manual
  pi: bridged
  codex: bridged
security:
  network_hosts: [api.github.com, ghcr.io]
  secret_storage: environment variable
  notes: Prefer fine-grained PAT via GITHUB_PERSONAL_ACCESS_TOKEN; OAuth also supported by official server
