    id: figma
    display_name: Figma
    purpose: Fetch design context, screenshots, variables, and implement Figma nodes
      to code
    what:
      verbs:
        - get_design_context
        - get_screenshot
        - get_metadata
        - implement
      entities:
        - file
        - node
        - component
        - variable
        - screenshot
    how:
      - id: figma-mcp-official
        mechanism: mcp
        targets:
          - claude-code
          - cursor
          - opencode
          - vscode
        package: https://mcp.figma.com/mcp
        repository: https://www.figma.com/developers/mcp
        license: proprietary
        transport: streamable_http
        provenance: official
        version_policy: remote hosted
        auth:
          type: bearer-env
          env:
            - FIGMA_OAUTH_TOKEN
            - FIGMA_REGION
          scopes:
            - file_content:read
        read:
          - get_design_context
          - get_file_structure
          - get_screenshot
          - get_metadata
        write: []
        destructive: []
        permissions:
          source_trust: official
          runtime_privilege: read-only
          requires_approval: false
        runtime:
          local_vs_remote: remote
          sandbox: remote hosted, OAuth
